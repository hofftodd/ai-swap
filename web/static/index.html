// ---- load / unload / logs ----------------------------------------------------

async function modelAction(id, act) {
  if (pending.has(id)) return;
  const m = info(id);
  if (act === "unload" && m?.resident && !confirm(`${m.name} is this machine's resident model.\n\nUnloaded by hand, it stays unloaded until something uses it again. Unload it?`)) return;
  pending.set(id, act);
  if (act === "load") startingSince.set(id, Date.now());
  paintFleetViews();
  const poll = setTimeout(refresh, 400);
  try {
    const r = await fetch(`/api/models/${encodeURIComponent(id)}/${act}`, { method: "POST" });
    if (!r.ok) toast(`${act === "load" ? "Loading" : "Unloading"} ${id} failed: ${(await r.json().catch(() => ({}))).error || r.statusText}`, "bad", 8000);
  } catch (e) {
    toast(`${act === "load" ? "Loading" : "Unloading"} ${id} failed: ${e.message}`, "bad", 8000);
  } finally {
    clearTimeout(poll); pending.delete(id); refresh();
  }
}

async function releaseLock(node) {
  const nd = nodes.find(x => x.name === node);
  if (!nd?.lock || !confirm(`Release ${node}? ${lockText(nd.lock)}\n\nIf that benchmark is still running, its results will be disturbed.`)) return;
  try {
    // ai-swap forwards ?node=<peer> to that machine.
    const r = await fetch(`/api/lock?force=1&node=${encodeURIComponent(node)}`, { method: "DELETE" });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
    toast(`Released ${node}.`);
  } catch (e) { toast(`Couldn't release ${node}: ${e.message}`, "bad", 8000); }
  refresh();
}

let logFor = "", logTimer = 0;
async function openLogs(id) {
  logFor = id;
  $("logTitle").textContent = "Logs · " + id;
  $("logText").textContent = "Loading…";
  if (!$("logs").open) $("logs").showModal();
  await pullLogs();
  clearInterval(logTimer);
  logTimer = setInterval(pullLogs, 2000);
}
async function pullLogs() {
  if (!$("logs").open) { clearInterval(logTimer); return; }
  const pre = $("logText");
  try {
    const t = (await (await fetch(`/api/models/${encodeURIComponent(logFor)}/logs`)).text()) || "(no output yet)";
    if (pre.textContent !== t) {
      const top = pre.scrollTop;
      pre.textContent = t;
      pre.scrollTop = $("logFollow").checked ? pre.scrollHeight : top;
    }
  } catch (e) { pre.textContent = "Couldn't fetch logs: " + e.message; }
}

// ---- stats pane --------------------------------------------------------------

const GB = 1024 ** 3;
const fmtBytes = b => b >= GB ? (b / GB).toFixed(b >= 10 * GB ? 1 : 2) + " GB" : (b / 1024 ** 2).toFixed(0) + " MB";
const fmtCount = n => n >= 1e9 ? (n / 1e9).toFixed(1) + "B" : n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? (n / 1e3).toFixed(1) + "k" : String(n ?? 0);
const fmtTok = n => n >= 1024 && n % 1024 === 0 ? (n / 1024) + "k" : fmtCount(n);
const fmtSecs = s => s < 1 ? (s * 1000).toFixed(0) + " ms" : s < 90 ? s.toFixed(1) + " s" : s < 5400 ? (s / 60).toFixed(0) + " min" : (s / 3600).toFixed(1) + " h";
const fmtTPS = v => v ? v.toFixed(v >= 100 ? 0 : 1) : "—";
const row = (k, v, title) => v === undefined || v === null || v === "" ? "" : `<dt>${k}</dt><dd${title ? ` title="${esc(title)}"` : ""}>${v}</dd>`;
function meter(label, used, total, extra) {
  const pct = total ? Math.min(100, 100 * used / total) : 0;
  return `<div class="meter"><div class="row"><span>${label}</span><span>${extra ?? `${fmtBytes(used)} / ${fmtBytes(total)}`}</span></div><div class="bar"><div style="width:${pct}%"></div></div></div>`;
}
function spark(vals) {
  if (!vals || vals.length < 2) return "";
  const max = Math.max(...vals), top = max * 1.1, n = vals.length;
  const pts = vals.map((v, i) => `${(i / (n - 1) * 100).toFixed(1)},${(31 - v / top * 29).toFixed(1)}`).join(" ");
  return `<div class="spark-wrap"><span class="smax">max ${fmtTPS(max)}</span><svg viewBox="0 0 100 32" preserveAspectRatio="none" role="img" aria-label="Generation speed over the last ${n} requests, up to ${fmtTPS(max)} tokens per second"><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg></div>`;
}

let statsBusy = false;
const statsVisible = () => getComputedStyle($("stats")).display !== "none";
async function refreshStats() {
  if (statsBusy || !statsVisible() || !selected) return;
  const id = selected;
  statsBusy = true;
  try {
    const r = await fetch(`/api/models/${encodeURIComponent(id)}/stats`);
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
    const d = await r.json();
    if (selected === id) renderStats(id, d);
  } catch (e) {
    if (selected === id) setHTML($("stats"), `${statsHead(id, info(id))}<div class="note bad">Stats unavailable: ${esc(e.message)}</div>`);
  } finally { statsBusy = false; }
}

function statsHead(id, st) {
  const m = { ...(info(id) || {}), ...(st || {}), id };
  const p = pending.get(id), up = isUp(m);
  const w = stateWord(m);
  const sub = [w.text || (m.state === "stopped" ? "not loaded" : m.state || ""), m.engine && `${m.engine} on ${m.node || status?.node?.name || ""}`].filter(Boolean).join(" · ");
  return `<div class="st-top"><h2>${esc(id)}</h2><button class="ghost small close-btn" data-close data-k="st-close" aria-label="Close stats" style="margin-top:10px">✕</button></div>
    <div class="sub"><span class="dot ${esc(m.state || "stopped")}"></span><span>${esc(sub)}</span>${m.resident ? `<span class="pill">resident</span>` : ""}</div>
    <div class="actions"><button class="small${up ? "" : " primary"}" data-act="${up ? "unload" : "load"}" data-k="st-act" ${p ? "disabled" : ""}>${p ? (p === "load" ? "Loading…" : "Unloading…") : up ? "Unload" : "Load"}</button>
    <button class="small" data-act="logs" data-k="st-logs">Logs</button></div>`;
}

function renderStats(id, d) {
  const st = d.status, c = d.config, b = d.backend || {}, q = d.requests || {}, mt = b.metrics || {};
  const ready = st.state === "ready", last = q.last;
  let h = statsHead(id, { ...st, node: d.node });
  if (st.error) h += `<div class="note bad">${esc(st.error)}</div>`;

  // Headline numbers: generation, prompt processing, time to first token.
  const ttft = last?.ttft_seconds ? fmtSecs(last.ttft_seconds).split(" ") : null;
  if (q.requests) h += `<div class="kpis">
    <div class="kpi"><div class="label">Generate</div><div class="big">${fmtTPS(last?.gen_tps)}<small> t/s</small></div><div class="subv">${q.avg_gen_tps ? "avg " + fmtTPS(q.avg_gen_tps) : "&nbsp;"}</div></div>
    <div class="kpi"><div class="label">Prompt</div><div class="big">${fmtTPS(last?.prompt_tps || q.avg_prompt_tps)}<small> t/s</small></div><div class="subv">${q.avg_prompt_tps ? "avg " + fmtTPS(q.avg_prompt_tps) : "&nbsp;"}</div></div>
    <div class="kpi"><div class="label">First token</div><div class="big">${ttft ? `${ttft[0]}<small> ${ttft[1]}</small>` : "—"}</div><div class="subv">${q.avg_ttft_seconds ? "avg " + fmtSecs(q.avg_ttft_seconds) : "&nbsp;"}</div></div>
  </div>`;
  if (!q.requests) h += `<div class="note" style="margin:14px 0 6px">No requests through ai-swap since it started. Speeds appear here after the first reply.</div>`;
  else if (!ready) h += `<div class="lastrun">From the last run; the model isn't loaded now.</div>`;
  h += spark(q.recent_gen_tps);

  // One line of what the model is.
  const mods = (b.modalities || []).filter(x => x && x !== "text");
  const chips = [
    b.params && fmtCount(b.params) + " params", b.quant, (b.ctx_per_slot || c.ctx) && fmtTok(b.ctx_per_slot || c.ctx) + " ctx",
    ...mods, b.tools && "tools", (b.speculative || q.draft_accept_rate) && ("spec. decode" + (q.draft_accept_rate ? " " + Math.round(q.draft_accept_rate * 100) + "%" : "")),
  ].filter(Boolean);
  if (chips.length) h += `<div class="chips">${chips.map(x => `<span>${esc(x)}</span>`).join("")}</div>`;

  // One memory bar: the main GPU if the OS reports it, else the node's plan.
  const gpu = (d.gpus || [])[0];
  if (gpu) h += meter(`GPU memory${gpu.busy_percent !== undefined ? ` · ${gpu.busy_percent}% busy` : ""}`, gpu.vram_used_bytes, gpu.vram_total_bytes);
  else {
    const nd = nodes.find(n => n.name === d.node);
    h += `<div class="meter"><div class="row"><span>Reserved on ${esc(d.node)}</span><span>${c.node_used_gb.toFixed(0)} / ${c.node_budget_gb ? c.node_budget_gb.toFixed(0) : "∞"} GB</span></div>${nd ? memBar(nd) : ""}</div>`;
  }

  if (q.requests) h += `<div class="reqline">${q.requests} request${q.requests === 1 ? "" : "s"}${q.errors ? ` (${q.errors} failed)` : ""} · ${fmtCount(q.prompt_tokens)} in / ${fmtCount(q.completion_tokens)} out</div>`;
  if (last?.gen_tps_source === "measured") h += `<div class="note">Last speed measured from the stream (the engine sent no timings for that request).</div>`;

  // Everything else, collapsed.
  const up = st.loaded_at ? (Date.now() - Date.parse(st.loaded_at)) / 1000 : 0;
  const file = b.model_path || c.model;
  h += `<details class="more" id="statsMore" data-k="st-more"${store.get("aiswap.statsMore", false) ? " open" : ""}><summary>Details</summary>
    <h3>Requests</h3><dl>
      ${row("Last request", last ? `${fmtCount(last.prompt_tokens || 0)} in${last.cached_tokens ? ` (${fmtCount(last.cached_tokens)} cached)` : ""} · ${fmtCount(last.completion_tokens || 0)} out` : "none yet")}
      ${row("Draft acceptance", q.draft_accept_rate ? (q.draft_accept_rate * 100).toFixed(0) + "%" : null, "Speculative decoding: share of drafted tokens the model accepted")}
    </dl>
    ${ready && (b.slots || mt.requests_processing !== undefined) ? `<h3>Engine, live</h3>
      ${mt.kv_cache_usage_ratio !== undefined ? meter("KV cache", mt.kv_cache_usage_ratio, 1, (mt.kv_cache_usage_ratio * 100).toFixed(1) + "%") : ""}<dl>
      ${row("Slots busy", b.slots ? `${b.slots_busy ?? "?"} / ${b.slots}` : null, "Parallel request slots in the engine")}
      ${row("Queued", mt.requests_deferred !== undefined ? String(mt.requests_deferred) : null)}
      ${row("Generated since load", mt.tokens_predicted_total !== undefined ? fmtCount(mt.tokens_predicted_total) : null)}
      ${row("Engine avg generate", mt.predicted_tokens_seconds ? fmtTPS(mt.predicted_tokens_seconds) + " t/s" : null)}
      ${row("Engine avg prompt", mt.prompt_tokens_seconds ? fmtTPS(mt.prompt_tokens_seconds) + " t/s" : null)}</dl>` : ""}
    <h3>Memory</h3><dl>
      ${row("This model reserves", c.memory_gb + " GB", "memory_gb from the config, used to plan swaps")}
      ${row("Node", `${c.node_used_gb.toFixed(0)} / ${c.node_budget_gb ? c.node_budget_gb.toFixed(0) : "∞"} GB reserved`)}
      ${row("Process RSS", d.rss_bytes ? fmtBytes(d.rss_bytes) : null, "Resident memory of the engine process. With a discrete GPU, weights in VRAM are not included.")}
    </dl>
    ${(d.gpus || []).map((g, i) => meter(`GPU ${i} VRAM (${fmtBytes(g.vram_total_bytes)})${g.busy_percent !== undefined ? ` · ${g.busy_percent}%` : ""}`, g.vram_used_bytes, g.vram_total_bytes)
      + (g.gtt_used_bytes > 256 * 1024 ** 2 ? meter(`GPU ${i} system RAM (GTT)`, g.gtt_used_bytes, g.gtt_total_bytes) : "")).join("")}
    <h3>Model</h3><dl>
      ${row("Parameters", b.params ? fmtCount(b.params) : null)}
      ${row("Quantization", b.quant ? esc(b.quant) : null)}
      ${row("Weights", b.size_bytes ? fmtBytes(b.size_bytes) : null)}
      ${row("Context / request", b.ctx_per_slot ? fmtTok(b.ctx_per_slot) : (c.ctx ? fmtTok(c.ctx) : null))}
      ${row("Context total", b.ctx && b.ctx !== b.ctx_per_slot ? fmtTok(b.ctx) : null)}
      ${row("Trained context", b.ctx_train ? fmtTok(b.ctx_train) : null)}
      ${row("Inputs", (b.modalities || []).length ? esc(b.modalities.join(", ")) : null)}
      ${row("Tool calling", b.tools === undefined ? null : b.tools ? "yes" : "no")}
      ${row("Vocabulary", b.vocab ? fmtCount(b.vocab) : null)}
      ${row("Embedding dim", b.embed_dim ? String(b.embed_dim) : null)}
    </dl>${ready ? "" : `<div class="note">Load the model to see what the engine reports about it.</div>`}
    <h3>Backend</h3><dl>
      ${row("Engine", esc(st.engine) + (b.build ? ` <span style="color:var(--muted)">${esc(b.build)}</span>` : ""))}
      ${row("Loaded for", up ? fmtSecs(up) : null)}
      ${row("Load time", st.load_seconds ? fmtSecs(st.load_seconds) : null, "Process start until the health check passed")}
      ${row("Idle unload", st.resident ? "never (resident)" : c.ttl_seconds ? "after " + fmtSecs(c.ttl_seconds) : "never")}
      ${row("Port", st.port ? String(st.port) : null)}
      ${row("PID", st.pid ? String(st.pid) : null)}
      ${row("File", file ? `<span title="${esc(file)}">${esc(file.split("/").pop())}</span>` : null)}
    </dl></details>`;
  setHTML($("stats"), h);
}

// ---- data --------------------------------------------------------------------

async function refresh() {
  try {
    const [mr, sr] = await Promise.all([fetch("/v1/models"), fetch("/api/status")]);
    if (!mr.ok || !sr.ok) throw new Error("bad status");
    models = (await mr.json()).data || [];
    status = await sr.json();
    failures = 0; $("offline").classList.add("hidden");
    $("ver").textContent = status.node.version ? "v" + status.node.version : "";
    const first = !nodes.length;
    buildFleet();
    renderModelList(); renderTop(); renderFleet();
    if (first || !current() || !current().messages.length) { if (!streaming) renderMessages(); }
    refreshStats();
  } catch (e) {
    if (++failures >= 2) $("offline").classList.remove("hidden");
  }
}
function paintFleetViews() {
  renderModelList(); renderTop(); renderFleet();
  // Reflect a pending load/unload on the stats button right away; the next stats fetch redraws the rest.
  const b = $("stats").querySelector('[data-k="st-act"]'), p = pending.get(selected);
  if (b && p) { b.disabled = true; b.textContent = p === "load" ? "Loading…" : "Unloading…"; }
}

function selectModel(id, { keepDrawer = false } = {}) {
  if (!id) return;
  selected = id;
  $("filter").value = ""; // show the whole list again once a model is picked
  store.set("aiswap.model", id);
  const c = current();
  if (c && !streaming) { c.model = id; save(); }
  render();
  setHTML($("stats"), statsHead(id, info(id)));
  refreshStats();
  if (!keepDrawer) closeDrawers();
  if (!coarse) $("input").focus({ preventScroll: true });
}

function newChat() {
  const c = current();
  if (c && !c.messages.length) { closeDrawers(); $("input").focus(); return; } // reuse an empty chat
  const n = { id: newId(), title: "New chat", model: selected, messages: [] };
  chats.unshift(n); currentId = n.id; save(); render(); closeDrawers();
  $("input").focus();
}

function deleteChat(id) {
  const idx = chats.findIndex(c => c.id === id);
  if (idx < 0) return;
  if (streaming?.chatId === id) abort?.abort();
  const [gone] = chats.splice(idx, 1);
  const wasCurrent = currentId === id;
  if (wasCurrent) currentId = chats[0]?.id ?? null;
  save(); render();
  toast(`Deleted “${gone.title}”`, "", 6000, { label: "Undo", run: () => { chats.splice(idx, 0, gone); if (wasCurrent) currentId = gone.id; save(); render(); } });
}

// ---- sending -------------------------------------------------------------------

async function send(text, { retry = false } = {}) {
  let c = current();
  if (!c) { const n = { id: newId(), title: "New chat", model: selected, messages: [] }; chats.unshift(n); currentId = n.id; c = n; }
  const model = selected;
  if (!model) { toast("Pick a model first.", "bad"); return; }
  c.model = model;
  if (!retry) {
    if (!c.messages.length) c.title = text.replace(/\s+/g, " ").slice(0, 60);
    c.messages.push({ role: "user", content: text });
  }
  const m0 = info(model);
  const loading = !!m0 && m0.state !== "ready";
  const reply = { role: "assistant", model, node: m0?.node, content: "", thinking: "", streaming: true,
    phase: loading ? `Loading ${model}…` : "Waiting for the first token…" };
  c.messages.push(reply);
  streaming = { chatId: c.id, reply };
  save(); render();

  const box = $("messages");
  const el = box.lastElementChild;
  const nearBottom = () => box.scrollHeight - box.scrollTop - box.clientHeight < 60;
  let frame = 0, stick = true, lastSave = Date.now();
  const paint = () => {
    frame = 0;
    if (!el.isConnected) return;
    fillAssistant(el, reply);
    if (stick) box.scrollTop = box.scrollHeight;
  };
  const schedule = () => { stick = nearBottom(); if (!frame) frame = requestAnimationFrame(paint); };
  const t0 = performance.now();
  const ticker = setInterval(() => {
    if (!reply.content && !reply.thinking) {
      const s = Math.round((performance.now() - t0) / 1000);
      reply.phase = loading && info(model)?.state !== "ready" ? `Loading ${model}… ${s}s` : `Waiting for the first token… ${s}s`;
    }
    schedule();
  }, 1000);

  abort = new AbortController();
  $("send").textContent = "Stop"; $("send").classList.add("stop");
  renderTop();
  let tFirst = 0, chunks = 0, usage = null;
  try {
    const history = c.messages.slice(0, -1).filter(m => !m.error && (m.role === "user" || m.content)).map(m => ({ role: m.role, content: m.content }));
    const res = await fetch("/v1/chat/completions", {
      method: "POST", headers: { "Content-Type": "application/json" }, signal: abort.signal,
      body: JSON.stringify({ model, stream: true, stream_options: { include_usage: true }, messages: history }),
    });
    if (!res.ok) {
      const j = await res.json().catch(() => ({}));
      throw new Error(j.error?.message || res.statusText);
    }
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, i).trim();
        buf = buf.slice(i + 1);
        if (!line.startsWith("data:")) continue;
        const data = line.slice(5).trim();
        if (data === "[DONE]") continue;
        let j; try { j = JSON.parse(data); } catch { continue; }
        if (j.usage) usage = j.usage;
        if (j.error) throw new Error(j.error.message || "stream error");
        const d = j.choices?.[0]?.delta;
        if (!d) continue;
        const think = d.reasoning_content ?? d.reasoning ?? "";
        if (think || d.content) { if (!tFirst) tFirst = performance.now(); chunks++; }
        if (think) { if (!reply.tThink0) reply.tThink0 = Date.now(); reply.thinking += think; }
        if (d.content) {
          if (reply.thinking && reply.thinkSecs === undefined) reply.thinkSecs = (Date.now() - reply.tThink0) / 1000;
          reply.content += d.content;
        }
        schedule();
        if (Date.now() - lastSave > 1500) { save(); lastSave = Date.now(); }
      }
    }
  } catch (e) {
    if (e.name === "AbortError") reply.stopped = true;
    else reply.error = e.message; // keep whatever arrived before the failure
  } finally {
    clearInterval(ticker);
    if (frame) cancelAnimationFrame(frame);
    if (reply.thinking && reply.thinkSecs === undefined && reply.tThink0) reply.thinkSecs = (Date.now() - reply.tThink0) / 1000;
    delete reply.phase; delete reply.tThink0;
    const secs = (performance.now() - (tFirst || t0)) / 1000;
    const toks = usage?.completion_tokens ?? chunks;
    const parts = [];
    if (tFirst) parts.push(`first token ${((tFirst - t0) / 1000).toFixed(1)}s`);
    if (toks && secs > 0 && tFirst) parts.push(`${(toks / secs).toFixed(1)} tok/s`);
    if (usage) parts.push(`${usage.prompt_tokens} in / ${usage.completion_tokens} out`);
    if (reply.stopped) parts.push("stopped");
    reply.meta = parts.join(" · ");
    streaming = null; abort = null;
    delete reply.streaming;
    save();
    if (el.isConnected) { fillAssistant(el, reply); if (stick) box.scrollTop = box.scrollHeight; }
    $("send").textContent = "Send"; $("send").classList.remove("stop");
    $("live").textContent = reply.error ? "Reply failed: " + reply.error : reply.stopped ? "Reply stopped." : "Reply finished.";
    renderTop(); renderChats();
    refresh();
  }
}

// ---- drawers and views -------------------------------------------------------------

function closeDrawers() { document.body.classList.remove("side-open", "stats-open"); syncStatsToggle(); }
function syncStatsToggle() {
  $("statsToggle").setAttribute("aria-pressed", String(statsOverlay() ? document.body.classList.contains("stats-open") : !document.body.classList.contains("no-stats")));
}
function showView(which) {
  const isModels = which === "models";
  $("view-models").classList.toggle("hidden", !isModels);
  $("view-chat").classList.toggle("hidden", isModels);
  $("tabChat").setAttribute("aria-selected", String(!isModels));
  $("tabModels").setAttribute("aria-selected", String(isModels));
  if (isModels) { $("fleet")._html = null; renderFleet(); } else renderMessages();
}

// ---- events ------------------------------------------------------------------------

$("form").onsubmit = (e) => {
  e.preventDefault();
  if (abort) { abort.abort(); return; }
  const text = $("input").value.trim();
  if (!text) return;
  $("input").value = ""; autosize();
  send(text);
};
$("input").addEventListener("keydown", (e) => {
  // On touch keyboards Enter is a new line; the Send button sends.
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing && !coarse) { e.preventDefault(); $("form").requestSubmit(); }
});
function autosize() { const t = $("input"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 240) + "px"; }
$("input").addEventListener("input", autosize);
$("newChat").onclick = newChat;
$("filter").addEventListener("input", renderModelList);
$("filter").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { const first = $("modelList").querySelector(".model-row"); if (first) selectModel(first.dataset.model); }
  if (e.key === "ArrowDown") { e.preventDefault(); $("modelList").querySelector(".model-row")?.focus(); }
  if (e.key === "Escape" && $("filter").value) { e.stopPropagation(); $("filter").value = ""; renderModelList(); }
});
$("modelList").addEventListener("click", (e) => {
  const a = e.target.closest("[data-act]");
  if (a) { modelAction(a.dataset.ref, a.dataset.act); return; }
  const r = e.target.closest("[data-model]");
  if (r) { selectModel(r.dataset.model); return; }
  const n = e.target.closest("[data-node]");
  if (n) {
    const name = n.dataset.node;
    collapsed.has(name) ? collapsed.delete(name) : collapsed.add(name);
    store.set("aiswap.collapsed", [...collapsed]);
    renderModelList();
  }
});
$("modelList").addEventListener("keydown", (e) => {
  if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
  const rows = [...$("modelList").querySelectorAll(".model-row")];
  const i = rows.indexOf(document.activeElement);
  if (i < 0) return;
  e.preventDefault();
  const next = rows[i + (e.key === "ArrowDown" ? 1 : -1)];
  if (next) next.focus(); else if (e.key === "ArrowUp") $("filter").focus();
});
$("chatList").addEventListener("click", (e) => {
  const d = e.target.closest("[data-del]");
  if (d) { deleteChat(d.dataset.del); return; }
  const o = e.target.closest("[data-chat]");
  if (!o) return;
  currentId = o.dataset.chat;
  const c = current();
  if (c?.model && fleet.some(m => m.id === c.model)) { selected = c.model; store.set("aiswap.model", selected); }
  save(); render(); refreshStats(); closeDrawers();
});
$("messages").addEventListener("click", async (e) => {
  const cb = e.target.closest("[data-code]");
  if (cb) {
    const block = cb.closest(".code");
    if (cb.dataset.code === "wrap") { block.classList.toggle("wrap"); return; }
    const ok = await copyText(block.querySelector("code").textContent);
    cb.textContent = ok ? "Copied" : "Copy failed"; setTimeout(() => cb.textContent = "Copy", 1500);
    return;
  }
  const b = e.target.closest("[data-msg]");
  if (!b) return;
  const c = current(), i = +b.closest(".msg").dataset.i, m = c?.messages[i];
  if (!m) return;
  if (b.dataset.msg === "copy") { const ok = await copyText(m.content); b.textContent = ok ? "Copied" : "Copy failed"; setTimeout(() => b.textContent = "Copy", 1500); return; }
  if (streaming) return;
  if (b.dataset.msg === "retry") {
    // Drop this reply and everything after it, then ask again from the turn before.
    c.messages.splice(i);
    if (!c.messages.length || c.messages[c.messages.length - 1].role !== "user") { save(); render(); return; }
    send(null, { retry: true });
  }
  if (b.dataset.msg === "edit") {
    $("input").value = m.content; autosize();
    c.messages.splice(i); save(); render();
    $("input").focus();
    toast("Message moved back to the box; the turns after it were removed.");
  }
});
$("stats").addEventListener("click", (e) => {
  if (e.target.closest("[data-close]")) { closeDrawers(); return; }
  const b = e.target.closest("[data-act]");
  if (!b) return;
  if (b.dataset.act === "logs") openLogs(selected); else modelAction(selected, b.dataset.act);
});
$("stats").addEventListener("toggle", (e) => { if (e.target.id === "statsMore") store.set("aiswap.statsMore", e.target.open); }, true);
$("fleet").addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  if (b.dataset.act === "logs") openLogs(b.dataset.ref);
  else if (b.dataset.act === "chat") { showView("chat"); selectModel(b.dataset.ref); }
  else if (b.dataset.act === "release") releaseLock(b.dataset.ref);
  else modelAction(b.dataset.ref, b.dataset.act);
});
$("side").addEventListener("click", (e) => { if (e.target.closest("[data-close]")) closeDrawers(); });
$("chip").onclick = () => {
  if (narrow()) document.body.classList.add("side-open");
  $("filter").focus();
};
$("sideToggle").onclick = () => { document.body.classList.toggle("side-open"); if (document.body.classList.contains("side-open")) $("filter").focus(); };
$("backdrop").onclick = closeDrawers;
if (store.get("aiswap.stats", true) === false) document.body.classList.add("no-stats");
$("statsToggle").onclick = () => {
  if (statsOverlay()) { document.body.classList.remove("side-open"); document.body.classList.toggle("stats-open"); }
  else store.set("aiswap.stats", !document.body.classList.toggle("no-stats"));
  syncStatsToggle(); refreshStats();
};
$("tabChat").onclick = () => showView("chat");
$("tabModels").onclick = () => showView("models");
$("logClose").onclick = () => $("logs").close();
$("logs").addEventListener("close", () => clearInterval(logTimer));
matchMedia("(max-width: 1100px)").addEventListener("change", () => { closeDrawers(); refreshStats(); });

document.addEventListener("keydown", (e) => {
  const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName);
  if (e.key === "/" && !typing && !e.metaKey && !e.ctrlKey) { e.preventDefault(); if (narrow()) document.body.classList.add("side-open"); $("filter").focus(); return; }
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === "o") { e.preventDefault(); newChat(); return; }
  if (e.key === "Escape") {
    if ($("logs").open) return; // the dialog closes itself
    if (document.body.classList.contains("side-open") || document.body.classList.contains("stats-open")) { closeDrawers(); return; }
    if (abort) { abort.abort(); return; }
  }
});

// Poll every 3 s while the tab is visible; catch up as soon as it's shown again.
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
setInterval(() => { if (!document.hidden) refresh(); }, 3000);
// Keep "loading 12s" counters moving between polls.
setInterval(() => { if (!document.hidden && (startingSince.size || pending.size)) { renderModelList(); renderTop(); } }, 1000);

syncStatsToggle();
render();
refresh();
</script>
</body>
</html>
