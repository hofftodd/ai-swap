<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>ai-swap</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="mask-icon" href="favicon.svg" color="#3b7bff">
<style>
:root {
  color-scheme: light dark;
  --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --faint: #8f8f88;
  --border: #e3e2dd; --accent: #2f6fde; --accent-text: #fff; --accent-soft: #e8effc;
  --user: #eef3fd; --code: #f1f0ec; --ok: #1f8a4c; --warn: #a86b12; --bad: #c53030;
  --shadow: 0 8px 28px rgb(0 0 0 / .14); --ring: 0 0 0 3px rgb(47 111 222 / .18);
  --seg-ready: #2f6fde; --seg-busy: #7c5cd6; --seg-load: #d99a2b;
  --side-w: 280px; --stats-w: 320px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161615; --panel: #1f1f1d; --text: #ecebe6; --muted: #a3a39b; --faint: #7d7d76;
    --border: #33332f; --accent: #6b9cf5; --accent-text: #0d0d0c; --accent-soft: #233150;
    --user: #22293a; --code: #2a2a27; --ok: #4ccb84; --warn: #e2b04a; --bad: #f07171;
    --shadow: 0 8px 28px rgb(0 0 0 / .5); --ring: 0 0 0 3px rgb(107 156 245 / .25);
    --seg-ready: #6b9cf5; --seg-busy: #a48bf0; --seg-load: #e2b04a;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  height: 100dvh; background: var(--bg); color: var(--text);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
  display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr) var(--stats-w); grid-template-rows: 100%;
  overflow: hidden;
}
body.no-stats { grid-template-columns: var(--side-w) minmax(0, 1fr); }
button, input, textarea { font: inherit; color: inherit; }
button {
  border: 1px solid var(--border); background: var(--panel); border-radius: 8px;
  padding: 6px 12px; cursor: pointer;
}
button:hover { border-color: var(--muted); }
button:disabled { opacity: .55; cursor: default; }
button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
button.small { padding: 2px 9px; font-size: 13px; }
button.ghost { border-color: transparent; background: none; }
button.ghost:hover { background: var(--bg); border-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--faint); }
.dot.ready { background: var(--ok); }
.dot.starting, .dot.stopping { background: var(--warn); animation: pulse 1.2s ease-in-out infinite; }
.dot.failed { background: var(--bad); }
.dot.stopped { background: transparent; box-shadow: inset 0 0 0 1.5px var(--faint); }
@keyframes pulse { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .dot { animation: none !important; } }
.pill { font-size: 11px; line-height: 16px; padding: 0 6px; border: 1px solid var(--border); border-radius: 8px; color: var(--muted); white-space: nowrap; }
.bar { height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
.bar > div { height: 100%; background: var(--accent); }
.hidden { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.close-btn { display: none; }

/* ---- sidebar ---- */
#side {
  border-right: 1px solid var(--border); background: var(--panel);
  display: flex; flex-direction: column; min-height: 0; min-width: 0;
}
.side-head { padding: 14px 12px 6px 14px; display: flex; gap: 8px; align-items: center; }
.side-head h1 { font-size: 16px; margin: 0; flex: 1; display: flex; align-items: center; gap: 8px; letter-spacing: -.01em; }
.side-head h1 svg { width: 22px; height: 22px; flex: none; }
#ver { font-weight: 400; font-size: 12px; color: var(--faint); }
#cluster { padding: 0 14px 10px; font-size: 12px; color: var(--muted); }
.filter { margin: 0 10px 6px; position: relative; }
.filter input {
  width: 100%; padding: 6px 28px 6px 10px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--bg); font-size: 14px;
}
.filter kbd { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font: 11px ui-monospace, monospace; color: var(--faint); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }
.side-title {
  padding: 8px 14px 4px; font-size: 11px; font-weight: 600; letter-spacing: .06em;
  text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; align-items: center;
}
.side-title button { text-transform: none; letter-spacing: 0; font-weight: 500; }
#modelList { flex: 0 1 auto; max-height: 62%; overflow: auto; padding: 0 6px 6px; }
#chatList { flex: 1 1 auto; min-height: 96px; overflow: auto; padding: 0 6px 10px; }
.node-head {
  width: 100%; display: grid; grid-template-columns: auto 1fr auto; gap: 2px 8px; align-items: center;
  padding: 7px 8px 6px; margin-top: 2px; border: 0; border-radius: 8px; background: none; text-align: left; font-size: 13px;
}
.node-head:hover { background: var(--bg); }
.node-head .nname { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.node-head .nmem { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
.node-head .bar { grid-column: 2 / 4; }
.node-head .tag { font-weight: 400; color: var(--faint); font-size: 11px; margin-left: 4px; }
.node-head .nname { display: flex; align-items: center; gap: 6px; }
.node-head .srv { width: 16px; height: 16px; flex: none; color: var(--muted); }
.node-head.off .srv { color: var(--bad); }
.pill.res { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 50%, transparent); }
.resv { grid-column: 1 / 3; display: flex; gap: 10px; align-items: center; font-size: 13px; padding: 6px 10px; border-radius: 8px;
  border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent); background: color-mix(in srgb, var(--warn) 10%, transparent); }
.resv span { flex: 1; }
.mbar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; display: flex; gap: 1px; }
.mbar > i { display: block; height: 100%; background: var(--seg-ready); }
.mbar > i.busy { background: var(--seg-busy); }
.mbar > i.starting, .mbar > i.stopping { background: repeating-linear-gradient(-45deg, var(--seg-load) 0 4px, color-mix(in srgb, var(--seg-load) 55%, transparent) 4px 8px); }
.node-head .mbar { grid-column: 2 / 4; }
.node-head .caret { color: var(--faint); font-size: 10px; width: 8px; transition: transform .15s; }
.node-head[aria-expanded="false"] .caret { transform: rotate(-90deg); }
.node-off { color: var(--bad); font-size: 12px; }
.model-li { display: flex; align-items: center; border-radius: 8px; position: relative; }
.model-li:hover { background: var(--bg); }
.model-li.active { background: var(--accent-soft); }
.model-row {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; text-align: left;
  border: 0; background: none; padding: 6px 4px 6px 10px; font-size: 14px; border-radius: 8px;
}
.model-row .mname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.model-row .state { font-size: 12px; color: var(--muted); white-space: nowrap; }
.model-row .size { font-size: 12px; color: var(--faint); white-space: nowrap; font-variant-numeric: tabular-nums; }
.model-row .state.bad { color: var(--bad); }
.row-act { visibility: hidden; position: absolute; right: 6px; top: 50%; transform: translateY(-50%); font-size: 12px; padding: 1px 8px; box-shadow: -10px 0 8px -2px var(--panel); }
.model-li:hover .row-act { box-shadow: -10px 0 8px -2px var(--bg); }
.model-li.active .row-act { box-shadow: -10px 0 8px -2px var(--accent-soft); }
.model-li:hover .row-act, .model-li:focus-within .row-act, .row-act.pending { visibility: visible; }
.chat-li { display: flex; align-items: center; border-radius: 8px; }
.chat-li:hover { background: var(--bg); }
.chat-li.active { background: var(--accent-soft); }
.chat-open { flex: 1; min-width: 0; text-align: left; border: 0; background: none; padding: 6px 4px 6px 10px; border-radius: 8px; }
.chat-open .ctitle { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
.chat-open .cmodel { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; color: var(--muted); }
.chat-del { visibility: hidden; flex: none; border: 0; background: none; color: var(--muted); padding: 4px 8px; }
.chat-li:hover .chat-del, .chat-li:focus-within .chat-del { visibility: visible; }
.chat-del:hover { color: var(--bad); }
.side-empty { color: var(--muted); font-size: 13px; padding: 6px 10px; }
@media (hover: none) {
  .row-act, .chat-del { visibility: visible; }
  .row-act { position: static; transform: none; box-shadow: none !important; margin-right: 4px; flex: none; }
  .model-row .state.quiet { display: none; } /* the dot and the Unload button already say "loaded" */
}

/* ---- main ---- */
main { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.topbar {
  display: flex; gap: 8px; align-items: center; padding: 8px 12px; min-width: 0;
  border-bottom: 1px solid var(--border); background: var(--panel);
}
#sideToggle { display: none; }
.chip {
  display: flex; align-items: center; gap: 8px; min-width: 0; flex: 0 1 auto;
  border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px 4px 10px; background: var(--panel);
}
.chip .cname { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.chip .cstate { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.topbar .spacer { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; flex: none; }
.seg button { border: 0; border-radius: 0; padding: 3px 12px; font-size: 13px; background: var(--panel); }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-selected="true"] { background: var(--accent-soft); color: var(--text); font-weight: 600; }
#statsToggle { flex: none; }
#statsToggle[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
#offline { background: var(--bad); color: #fff; font-size: 13px; padding: 4px 12px; text-align: center; }
#view-chat, #view-models { flex: 1; min-height: 0; display: flex; flex-direction: column; }
#messages { flex: 1; overflow: auto; padding: 24px 16px 8px; overscroll-behavior: contain; }
.msg { max-width: 800px; margin: 0 auto 22px; }
.msg .role { font-size: 12px; color: var(--muted); margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
.msg .role b { color: var(--text); font-weight: 600; }
.msg .role .on { color: var(--faint); }
.msg .body { overflow-wrap: anywhere; }
.msg.user { display: flex; flex-direction: column; align-items: flex-end; }
.msg.user .body { background: var(--user); white-space: pre-wrap; padding: 9px 14px; border-radius: 16px 16px 4px 16px; max-width: min(88%, 640px); }
.msg.assistant .body { padding: 0 2px; }
.msg .meta { font-size: 12px; color: var(--muted); margin-top: 4px; display: flex; gap: 10px; align-items: center; min-height: 22px; flex-wrap: wrap; }
.msg.user .meta { justify-content: flex-end; }
.msg .meta .acts { display: inline-flex; gap: 2px; opacity: 0; transition: opacity .1s; }
.msg:hover .meta .acts, .msg:focus-within .meta .acts, .msg.last .meta .acts { opacity: 1; }
@media (hover: none) { .msg .meta .acts { opacity: 1; } }
.msg .meta .acts button { font-size: 12px; padding: 0 7px; }
.msg .err { color: var(--bad); border-top: 1px solid var(--border); margin-top: 8px; padding-top: 6px; font-size: 14px; }
.msg .err:empty { display: none; }
.msg .waiting { color: var(--muted); font-style: italic; }
.body > .content > :first-child { margin-top: 0; }
.body > .content > :last-child { margin-bottom: 0; }
.content p, .content ul, .content ol, .content blockquote, .content table, .content .code { margin: 0 0 10px; }
.content h1, .content h2, .content h3, .content h4, .content h5, .content h6 { margin: 14px 0 6px; line-height: 1.3; }
.content h1 { font-size: 1.3em; } .content h2 { font-size: 1.18em; } .content h3 { font-size: 1.06em; } .content h4, .content h5, .content h6 { font-size: 1em; }
.content ul, .content ol { padding-left: 22px; }
.content li > ul, .content li > ol { margin: 2px 0; }
.content blockquote { border-left: 3px solid var(--border); padding-left: 12px; color: var(--muted); }
.content hr { border: 0; border-top: 1px solid var(--border); margin: 12px 0; }
.content a { color: var(--accent); }
.content table { border-collapse: collapse; display: block; overflow-x: auto; max-width: 100%; }
.content th, .content td { border: 1px solid var(--border); padding: 4px 8px; text-align: left; font-size: 14px; }
.content th { background: var(--bg); }
.content code { background: var(--code); padding: 1px 4px; border-radius: 4px; font: 13px/1.45 ui-monospace, Menlo, monospace; }
.code { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--code); }
.code-head { display: flex; justify-content: space-between; align-items: center; padding: 2px 6px 2px 10px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--border); }
.code-head button { font-size: 12px; padding: 0 8px; }
.code pre { margin: 0; padding: 10px; overflow: auto; }
.code pre code { background: none; padding: 0; }
.code.wrap pre { white-space: pre-wrap; overflow-wrap: anywhere; }
details.thinking { margin-bottom: 8px; color: var(--muted); font-size: 14px; }
details.thinking summary { cursor: pointer; user-select: none; }
details.thinking .think-text { white-space: pre-wrap; border-left: 2px solid var(--border); padding-left: 10px; margin-top: 4px; max-height: 18em; overflow: auto; }
.empty { color: var(--muted); text-align: center; margin: 14vh auto 0; max-width: 480px; }
.empty b { color: var(--text); }
.hello { max-width: 520px; margin: 12vh auto 0; text-align: center; }
.hello .hname { font-size: 26px; font-weight: 650; letter-spacing: -.02em; overflow-wrap: anywhere; }
.hello .hstate { margin: 6px 0 14px; color: var(--muted); display: inline-flex; gap: 8px; align-items: center; }
.hello .chips { justify-content: center; }
.hello .tip { font-size: 13px; color: var(--faint); margin-top: 18px; }
.hello kbd, .hint kbd { font: 11px ui-monospace, monospace; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--panel); }
.composer { padding: 6px 16px calc(10px + env(safe-area-inset-bottom)); }
.composer .inner { max-width: 800px; margin: 0 auto; }
#notice { font-size: 13px; color: var(--muted); padding: 2px 2px 8px; display: flex; gap: 8px; align-items: baseline; }
#notice b { color: var(--text); font-weight: 600; }
#notice .ico { color: var(--warn); }
#form {
  display: flex; gap: 8px; align-items: flex-end; padding: 6px 6px 6px 4px;
  border: 1px solid var(--border); border-radius: 16px; background: var(--panel); box-shadow: 0 1px 3px rgb(0 0 0 / .05);
}
#form:focus-within { border-color: var(--accent); box-shadow: var(--ring); }
#input {
  flex: 1; resize: none; line-height: 1.45; min-height: calc(2.9em + 16px); max-height: 240px; padding: 8px 10px;
  border: 0; background: none; outline: none;
}
#send { border-radius: 11px; padding: 7px 16px; font-weight: 600; }
#send.stop { background: var(--text); border-color: var(--text); color: var(--bg); }
.hint { font-size: 11px; color: var(--faint); padding: 5px 4px 0; text-align: center; }
@media (pointer: coarse) { #input { font-size: 16px; } .hint { display: none; } }

/* ---- models view ---- */
#view-models { overflow: auto; padding: 20px 16px 32px; }
#fleet { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.fleet-sum { color: var(--muted); font-size: 13px; }
.ncard { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.ncard.off { opacity: .8; }
.ncard-head { padding: 12px 16px 12px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; }
.ncard-head h3 { margin: 0; font-size: 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ncard-head .nsub { color: var(--muted); font-size: 12px; }
.ncard-head .nmem { text-align: right; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ncard-head .nmem b { color: var(--text); font-weight: 600; }
.ncard-head .mbar { grid-column: 1 / 3; height: 8px; border-radius: 4px; margin-top: 4px; }
.legend { grid-column: 1 / 3; display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; gap: 5px; align-items: center; }
.legend i { width: 9px; height: 9px; border-radius: 2px; background: var(--seg-ready); display: inline-block; }
.legend i.busy { background: var(--seg-busy); } .legend i.starting { background: var(--seg-load); }
table.fleet { border-collapse: collapse; width: 100%; table-layout: fixed; }
.fleet col.c-state { width: 15%; } .fleet col.c-mem { width: 10%; } .fleet col.c-ctx { width: 9%; } .fleet col.c-eng { width: 11%; } .fleet col.c-act { width: 230px; }
.fleet td:first-child { overflow-wrap: anywhere; }
.fleet th, .fleet td { text-align: left; padding: 8px 16px; border-top: 1px solid var(--border); font-size: 14px; vertical-align: middle; }
.fleet th { color: var(--faint); font-weight: 500; font-size: 12px; padding-top: 6px; padding-bottom: 6px; }
.fleet tr.up td:first-child { box-shadow: inset 3px 0 0 var(--seg-ready); }
.fleet td.act { text-align: right; white-space: nowrap; }
.fleet td.num { font-variant-numeric: tabular-nums; }
.fleet .mn { font-weight: 500; }
.fleet .dot.inl { display: none; }
.fleet td.nw { white-space: nowrap; }
.fleet .state { display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
.fleet .sub { color: var(--muted); font-size: 12px; }
.fleet .errtxt { color: var(--bad); font-size: 12px; }
@media (max-width: 760px) {
  .fleet .hide-n { display: none; }
  .fleet col.c-act { width: 124px; }
  .fleet .hide-s, .fleet .sub.al { display: none; }
  .fleet .dot.inl { display: inline-block; margin-right: 6px; vertical-align: 1px; }
  .fleet td.act .ghost[data-act="logs"] { display: none; }
  .fleet th, .fleet td { padding-left: 12px; padding-right: 12px; }
}

/* ---- stats pane ---- */
#stats {
  border-left: 1px solid var(--border); background: var(--panel); overflow: auto;
  padding: 0 14px 16px; font-size: 13px; min-width: 0;
}
body.no-stats #stats { display: none; }
.st-top { display: flex; align-items: flex-start; gap: 8px; }
#stats h2 { font-size: 15px; margin: 14px 0 2px; overflow-wrap: anywhere; flex: 1; }
#stats .sub { color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
#stats .actions { display: flex; gap: 6px; margin: 10px 0 4px; }
#stats .note { color: var(--muted); font-size: 12px; margin-top: 6px; }
#stats .note.bad { color: var(--bad); }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 14px 0 4px; }
.kpi .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
.kpi .big { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.15; }
.kpi .big small { font-size: 12px; font-weight: 400; color: var(--muted); }
.kpi .subv { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.lastrun { font-size: 11px; color: var(--muted); }
.spark-wrap { position: relative; margin: 6px 0 2px; padding-top: 13px; color: var(--accent); }
.spark-wrap svg { width: 100%; height: 34px; display: block; }
.spark-wrap .smax { position: absolute; right: 0; top: 0; font-size: 10px; line-height: 12px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 10px 0; }
.chips span { font-size: 12px; padding: 1px 7px; border-radius: 6px; background: var(--bg); border: 1px solid var(--border); white-space: nowrap; }
.meter { margin: 8px 0; }
.meter .row { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 3px; }
.meter .row span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.reqline { color: var(--muted); margin: 6px 0; }
details.more { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 8px; }
details.more > summary { cursor: pointer; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
details.more h3 { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--faint); margin: 12px 0 4px; }
#stats dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0; }
#stats dt { color: var(--muted); white-space: nowrap; }
#stats dd { margin: 0; text-align: right; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }

/* ---- dialog, toast, drawers ---- */
dialog#logs { width: min(960px, 94vw); max-height: 86dvh; padding: 0; border: 1px solid var(--border); border-radius: 12px; background: var(--panel); color: var(--text); box-shadow: var(--shadow); }
dialog#logs::backdrop { background: rgb(0 0 0 / .35); }
.dlg-head { display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 16px; border-bottom: 1px solid var(--border); }
.dlg-head b { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dlg-head label { font-size: 13px; color: var(--muted); display: flex; gap: 4px; align-items: center; }
#logText { margin: 0; padding: 12px 16px; height: min(70dvh, 640px); overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.45 ui-monospace, Menlo, monospace; background: var(--code); }
#toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 30; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
.toast { pointer-events: auto; background: var(--text); color: var(--bg); padding: 8px 12px; border-radius: 10px; font-size: 14px; box-shadow: var(--shadow); display: flex; gap: 12px; align-items: center; max-width: 90vw; }
.toast.bad { background: var(--bad); color: #fff; }
.toast button { background: none; color: inherit; border-color: currentColor; font-size: 13px; padding: 1px 8px; }
#backdrop { display: none; position: fixed; inset: 0; background: rgb(0 0 0 / .32); z-index: 9; }

@media (max-width: 1100px) {
  body, body.no-stats { grid-template-columns: var(--side-w) minmax(0, 1fr); }
  #stats, body.no-stats #stats { display: none; }
  body.stats-open #stats { display: block; position: fixed; inset: 0 0 0 auto; width: min(360px, 92vw); z-index: 10; box-shadow: var(--shadow); }
  body.stats-open #backdrop { display: block; }
  body.stats-open #stats .close-btn { display: inline-block; }
}
@media (max-width: 760px) {
  body, body.no-stats { grid-template-columns: minmax(0, 1fr); }
  #side { display: none; }
  body.side-open #side { display: flex; position: fixed; inset: 0 auto 0 0; width: min(320px, 86vw); z-index: 10; box-shadow: var(--shadow); }
  body.side-open #backdrop { display: block; }
  body.side-open #side .close-btn { display: inline-block; }
  #sideToggle { display: inline-block; flex: none; }
  .seg { display: none; }
  .chip { flex: 1 1 auto; }
  .topbar { padding: 8px; gap: 6px; }
  #messages { padding: 16px 10px 8px; }
  .composer { padding-left: 10px; padding-right: 10px; }
  #statsToggle .lbl { display: none; }
}
</style>
</head>
<body>
<aside id="side" aria-label="Models and chats">
  <div class="side-head">
    <h1><svg viewBox="0 0 64 64" aria-hidden="true"><defs> <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"> <stop offset="0" stop-color="#3b7bff"/> <stop offset="1" stop-color="#7a4cf0"/> </linearGradient> </defs> <rect width="64" height="64" rx="14" fill="url(#lg)"/> <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round"> <g stroke-width="4"> <path d="M13 15.5C20 9.5 44 9.5 51 15.5"/> <path d="M45.9 15.2L51 15.5l-.6-5.1"/> <path d="M51 48.5C44 54.5 20 54.5 13 48.5"/> <path d="M18.1 48.8L13 48.5l.6 5.1"/> </g> <g stroke-width="2" transform="translate(32 32.3) scale(1.55) translate(-12 -12)"> <path d="M12 5.5A3 3 0 0 0 6.4 5.9 3.6 3.6 0 0 0 4.1 11.4 3.6 3.6 0 0 0 5.4 17 3.2 3.2 0 0 0 12 18.6Z"/> <path d="M12 5.5A3 3 0 0 1 17.6 5.9 3.6 3.6 0 0 1 19.9 11.4 3.6 3.6 0 0 1 18.6 17 3.2 3.2 0 0 1 12 18.6Z"/> <path d="M6.7 11.3c1.4 0 2.5-.9 2.7-2.3M17.3 11.3c-1.4 0-2.5-.9-2.7-2.3M7.6 16.2c.2-1.3 1.2-2.2 2.6-2.3M16.4 16.2c-.2-1.3-1.2-2.2-2.6-2.3"/> </g> </g></svg>ai-swap <span id="ver"></span></h1>

<main>
  <div id="offline" class="hidden" role="status">Can't reach ai-swap. Retrying…</div>
  <div class="topbar">

    <button class="chip" id="chip" title="Change model">
      <span class="dot" id="chipDot"></span><span class="cname" id="chipName">No model</span><span class="cstate" id="chipState"></span>
    </button>

<aside id="stats" aria-label="Model stats"><div class="note" style="margin-top:16px">Pick a model to see its stats.</div></aside>
<div id="backdrop"></div>
<dialog id="logs" aria-labelledby="logTitle">
  <div class="dlg-head"><b id="logTitle">Logs</b><label><input type="checkbox" id="logFollow" checked> Follow</label><button class="small" id="logClose">Close</button></div>
  <pre id="logText"></pre>
</dialog>
<div id="toast" aria-live="polite"></div>
<div id="live" class="sr-only" aria-live="polite"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) {
    try { localStorage.setItem(k, JSON.stringify(v)); return true; }
    catch { if (!store.warned) { store.warned = true; toast("Couldn't save chats: browser storage is full. Delete some old chats.", "bad", 8000); } return false; }
  },
};
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
const coarse = matchMedia("(pointer: coarse)").matches;
const narrow = () => matchMedia("(max-width: 760px)").matches;
const statsOverlay = () => matchMedia("(max-width: 1100px)").matches;

// ---- state ---------------------------------------------------------------

let chats = store.get("aiswap.chats", []);
let currentId = store.get("aiswap.current", null);
let selected = store.get("aiswap.model", "");
let models = [];       // /v1/models entries: routable ids
let status = null;     // /api/status
let fleet = [], nodes = [];
let abort = null, streaming = null; // streaming = { chatId, reply }
let failures = 0;
const collapsed = new Set(store.get("aiswap.collapsed", []));
const pending = new Map();        // model id -> "load" | "unload" while a request runs
const startingSince = new Map();  // model id -> ms timestamp first seen starting

// Replies interrupted by a reload or closed tab: keep what arrived, say so.
for (const c of chats) for (const m of c.messages) {
  if (!m.streaming) continue;
  delete m.streaming; delete m.phase; delete m.tThink0;
  if (!m.content && !m.thinking) m.error = "Interrupted: the page was closed during this reply.";
  else m.meta = [m.meta, "interrupted"].filter(Boolean).join(" · ");
}

function current() { return chats.find(c => c.id === currentId); }
function save() { store.set("aiswap.chats", chats); store.set("aiswap.current", currentId); }
function newId() {
  // crypto.randomUUID only exists in secure contexts; the UI is usually plain http on a LAN.
  if (crypto.randomUUID) return crypto.randomUUID();
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
}
function info(id) { return fleet.find(m => m.id === id); }

// setHTML only touches the DOM when the markup changed, and puts keyboard
// focus back on the element with the same data-k afterwards, so the 3-second
// poll never yanks focus or closes things.
function setHTML(el, html) {
  if (el._html === html) return;
  const a = document.activeElement;
  const key = a && el.contains(a) ? a.dataset.k : null;
  el.innerHTML = html; el._html = html;
  if (key) el.querySelector(`[data-k="${CSS.escape(key)}"]`)?.focus({ preventScroll: true });
}

function toast(msg, kind = "", ms = 4000, action) {
  const t = document.createElement("div");
  t.className = "toast " + kind; t.setAttribute("role", kind === "bad" ? "alert" : "status");
  t.innerHTML = `<span>${esc(msg)}</span>`;
  if (action) {
    const b = document.createElement("button"); b.textContent = action.label;
    b.onclick = () => { action.run(); t.remove(); }; t.appendChild(b);
  }
  $("toast").appendChild(t);
  setTimeout(() => t.remove(), ms);
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch {}
  // navigator.clipboard needs a secure context; fall back for plain http.
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand("copy"); } catch {}
  ta.remove(); return ok;
}

// ---- markdown ------------------------------------------------------------
// Escape first, then add a small, safe subset: headings, lists, tables,
// quotes, rules, fenced code, inline code, links (http/https only), bold,
// italics, strikethrough.

function inline(s) {
  const codes = [];
  s = esc(s).replace(/`([^`\n]+)`/g, (_, c) => { codes.push(c); return `\u0000${codes.length - 1}\u0000`; });
  s = s
    .replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+[^\s<).,;:!?'"])/g, '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>')
    .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
    .replace(/__([^_\n]+)__/g, "<strong>$1</strong>")
    .replace(/(^|[^*\w])\*([^*\s][^*\n]*?)\*(?!\w)/g, "$1<em>$2</em>")
    .replace(/(^|[^_\w])_([^_\s][^_\n]*?)_(?!\w)/g, "$1<em>$2</em>")
    .replace(/~~([^~\n]+)~~/g, "<del>$1</del>");
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[i]}</code>`);
}

const reList = /^(\s*)([-*+]|\d{1,9}[.)])\s+(.*)$/;
const reTableSep = /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/;
const isBlockStart = (l) => /^\s*(#{1,6}\s|>|```|~~~)/.test(l) || reList.test(l) || /^\s*([-*_])(\s*\1){2,}\s*$/.test(l);
const cells = (l) => l.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(c => c.trim());

function md(src) {
  const lines = String(src).replace(/\r/g, "").split("\n");
  const out = [];
  let i = 0;
  while (i < lines.length) {
    const l = lines[i];
    const fence = l.match(/^\s*(```+|~~~+)\s*([\w#+.-]*)/);
    if (fence) {
      const buf = []; i++;
      while (i < lines.length && !lines[i].trim().startsWith(fence[1])) buf.push(lines[i++]);
      i++;
      const lang = fence[2] || "";
      out.push(`<div class="code"><div class="code-head"><span>${esc(lang || "code")}</span><span><button class="ghost" data-code="wrap" title="Wrap long lines">Wrap</button><button class="ghost" data-code="copy">Copy</button></span></div><pre><code>${esc(buf.join("\n"))}</code></pre></div>`);
      continue;
    }
    if (!l.trim()) { i++; continue; }
    let m;
    if ((m = l.match(/^\s*(#{1,6})\s+(.*?)\s*#*\s*$/))) { out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); i++; continue; }
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)) { out.push("<hr>"); i++; continue; }
    if (/^\s*>/.test(l)) {
      const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, ""));
      out.push(`<blockquote>${md(buf.join("\n"))}</blockquote>`);
      continue;
    }
    if (l.includes("|") && i + 1 < lines.length && reTableSep.test(lines[i + 1]) && cells(lines[i + 1]).length === cells(l).length) {
      const head = cells(l), align = cells(lines[i + 1]).map(c => c.endsWith(":") ? (c.startsWith(":") ? "center" : "right") : "");
      i += 2;
      const body = [];
      while (i < lines.length && lines[i].includes("|") && lines[i].trim()) body.push(cells(lines[i++]));
      const td = (tag, c, j) => `<${tag}${align[j] ? ` style="text-align:${align[j]}"` : ""}>${inline(c)}</${tag}>`;
      out.push(`<table><thead><tr>${head.map((c, j) => td("th", c, j)).join("")}</tr></thead><tbody>${body.map(r => `<tr>${r.map((c, j) => td("td", c, j)).join("")}</tr>`).join("")}</tbody></table>`);
      continue;
    }
    if (reList.test(l)) { const [html, next] = list(lines, i); out.push(html); i = next; continue; }
    const para = [];
    while (i < lines.length && lines[i].trim() && !(para.length && isBlockStart(lines[i]))) para.push(lines[i++]);
    out.push(`<p>${para.map(inline).join("<br>")}</p>`);
  }
  return out.join("");
}

function list(lines, start) {
  const first = lines[start].match(reList);
  const base = first[1].length, ordered = /\d/.test(first[2]);
  const sameKind = (mm) => mm && mm[1].length === base && /\d/.test(mm[2]) === ordered;
  const items = [];
  let i = start;
  while (i < lines.length) {
    const l = lines[i];
    if (!l.trim()) {
      let j = i + 1; while (j < lines.length && !lines[j].trim()) j++;
      if (j < lines.length && (lines[j].match(/^(\s*)/)[1].length > base || sameKind(lines[j].match(reList)))) { i = j; continue; }
      break;
    }
    const m = l.match(reList);
    const indent = l.match(/^(\s*)/)[1].length;
    if (m && indent === base) { if (!sameKind(m)) break; items.push({ text: m[3], sub: [] }); i++; continue; }
    if (indent > base && items.length) { items[items.length - 1].sub.push(l.slice(Math.min(indent, base + 2))); i++; continue; }
    if (!m && indent <= base && items.length && !isBlockStart(l) && (lines[i - 1] || "").trim()) { items[items.length - 1].text += "\n" + l.trim(); i++; continue; }
    break;
  }
  const n0 = ordered ? parseInt(first[2], 10) : 1;
  const tag = ordered ? "ol" : "ul";
  return [`<${tag}${ordered && n0 !== 1 ? ` start="${n0}"` : ""}>${items.map(it =>
    `<li>${it.text.split("\n").map(inline).join("<br>")}${it.sub.length ? md(it.sub.join("\n")) : ""}</li>`).join("")}</${tag}>`, i];
}

// ---- fleet: models joined with node status --------------------------------

function buildFleet() {
  nodes = []; fleet = [];
  if (!status) return;
  const addNode = (name, local, online, n, err, seen) => nodes.push({
    name, local, online, error: err, budget: n?.memory_budget_gb || 0, used: n?.memory_used_gb || 0, models: n?.models || [],
    version: n?.version || "", os: n?.os || "", arch: n?.arch || "", seen, lock: n?.lock || null,
  });
  addNode(status.node.name, true, true, status.node);
  for (const p of status.peers || []) addNode(p.name, false, !!(p.online && p.node), p.node, p.error, p.last_seen);
  const now = Date.now();
  for (const nd of nodes) for (const m of nd.models) {
    if (!m.runnable) continue;
    const routed = models.find(x => x.node === nd.name && (x.id === m.name || x.id === m.name + "@" + nd.name));
    const id = routed ? routed.id : (nd.local ? m.name : m.name + "@" + nd.name);
    if (m.state === "starting") { if (!startingSince.has(id)) startingSince.set(id, now); } else if (!pending.has(id)) startingSince.delete(id);
    fleet.push({ ...m, id, node: nd.name, local: nd.local });
  }
  if (!selected || !fleet.some(m => m.id === selected)) {
    const pick = fleet.find(m => m.state === "ready") || fleet.find(m => m.resident) || fleet[0];
    if (pick) selected = pick.id;
  }
}

function stateWord(m) {
  const p = pending.get(m.id);
  if (p === "unload" || m.state === "stopping") return { text: "unloading", cls: "" };
  if (m.state === "starting" || p === "load") {
    const since = startingSince.get(m.id);
    return { text: "loading" + (since ? " " + Math.round((Date.now() - since) / 1000) + "s" : ""), cls: "" };
  }
  if (m.state === "ready") return { text: m.inflight ? "busy" : "loaded", cls: m.inflight ? "" : "quiet" };
  if (m.state === "failed") return { text: "failed", cls: "bad" };
  return { text: "", cls: "" };
}
const isUp = (m) => !!m && (m.state === "ready" || m.state === "starting");
// A workstation: a monitor on a stand beside a small tower.
const SERVER_ICON = `<svg class="srv" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1" y="2.5" width="9.5" height="7" rx="1"/><path d="M5.75 9.5v2.6M3.4 12.6h4.7"/><rect x="12" y="2.5" width="3" height="10.6" rx=".7"/><path d="M12.9 4.9h1.2"/><circle cx="13.5" cy="11" r=".55" fill="currentColor" stroke="none"/></svg>`;
const gb = (v) => v ? (v >= 10 ? v.toFixed(0) : v.toFixed(1).replace(/\.0$/, "")) + " GB" : "";
const segClass = (m) => m.state === "ready" ? (m.inflight ? "busy" : "") : m.state;
// One segment per model holding memory, so you can see what a swap would push out.
function memBar(nd) {
  const total = nd.budget || nd.models.reduce((t, m) => t + (isUp(m) || m.state === "stopping" ? m.memory_gb || 0 : 0), 0) || 1;
  const segs = nd.models.filter(m => isUp(m) || m.state === "stopping")
    .map(m => `<i class="${segClass(m)}" style="width:${Math.min(100, 100 * (m.memory_gb || 0) / total).toFixed(2)}%" title="${esc(m.name)}: ${gb(m.memory_gb)}${m.inflight ? ", busy" : m.state === "ready" ? "" : ", " + m.state}"></i>`).join("");
  return `<span class="mbar" role="img" aria-label="${esc(nd.name)} memory: ${nd.used.toFixed(0)} of ${nd.budget ? nd.budget.toFixed(0) + " GB" : "unlimited"} reserved">${segs}</span>`;
}
function lockText(l) {
  if (!l) return "";
  const at = new Date(l.since).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  return `Reserved by ${l.owner}${l.reason ? ` (${l.reason})` : ""} since ${at}. Requests from anyone else are refused until it's released.`;
}
function age(t) {
  if (!t) return "";
  const s = (Date.now() - Date.parse(t)) / 1000;
  return s < 90 ? Math.round(s) + " s" : s < 5400 ? Math.round(s / 60) + " min" : Math.round(s / 3600) + " h";
}

// ---- sidebar -----------------------------------------------------------

function renderModelList() {
  const q = $("filter").value.trim().toLowerCase();
  const multi = nodes.length > 1;
  let html = "";
  for (const nd of nodes) {
    const list = fleet.filter(m => m.node === nd.name && (!q || m.id.toLowerCase().includes(q)))
      .sort((a, b) => (isUp(b) - isUp(a)) || a.name.localeCompare(b.name));
    if (q && !list.length) continue;
    const open = !!q || !collapsed.has(nd.name);
    html += `<button class="node-head${nd.online ? "" : " off"}" data-node="${esc(nd.name)}" data-k="node:${esc(nd.name)}" aria-expanded="${open}" title="${esc(nd.name)}${nd.online ? "" : ": offline"}">
      <span class="caret" aria-hidden="true">▾</span><span class="nname">${SERVER_ICON}${esc(nd.name)}${multi && nd.local ? `<span class="tag">this machine</span>` : ""}${nd.lock ? `<span class="pill res" title="${esc(lockText(nd.lock))}">reserved</span>` : ""}</span>
      ${nd.online ? `<span class="nmem">${nd.used.toFixed(0)} / ${nd.budget ? nd.budget.toFixed(0) : "∞"} GB</span>
      <span></span>${memBar(nd)}` : `<span class="node-off">offline</span>`}</button>`;
    if (!open) continue;
    if (!nd.online) { html += `<div class="side-empty">${esc(nd.error || "Not reachable")}</div>`; continue; }
    for (const m of list) {
      const w = stateWord(m), p = pending.get(m.id);
      const act = p ? (p === "load" ? "Loading…" : "Unloading…") : isUp(m) ? "Unload" : "Load";
      const name = multi ? m.name : m.id;
      html += `<div class="model-li${m.id === selected ? " active" : ""}" role="listitem">
        <button class="model-row" data-model="${esc(m.id)}" data-k="m:${esc(m.id)}" tabindex="${m.id === selected ? 0 : -1}" aria-current="${m.id === selected}" title="${esc(m.id)} on ${esc(m.node)}">
          <span class="dot ${esc(m.state)}" aria-hidden="true"></span><span class="mname">${esc(name)}</span>
          ${m.resident ? `<span class="pill" title="Kept loaded by default; gives way when another model needs the memory">resident</span>` : ""}
          ${w.text && w.cls !== "quiet" ? `<span class="state ${w.cls}">${esc(w.text)}</span>` : `<span class="size">${gb(m.memory_gb)}</span>`}
          <span class="sr-only">${esc(w.text || "not loaded")}</span>
        </button>
        <button class="small row-act${p ? " pending" : ""}" tabindex="-1" data-act="${isUp(m) ? "unload" : "load"}" data-ref="${esc(m.id)}" ${p ? "disabled" : ""} aria-label="${act} ${esc(m.id)}">${act}</button>
      </div>`;
    }
  }
  if (!html) html = `<div class="side-empty">${status ? (q ? "No models match." : "No models configured.") : "Connecting…"}</div>`;
  setHTML($("modelList"), html);
  const up = fleet.filter(isUp).length, on = nodes.filter(n => n.online).length;
  setHTML($("cluster"), status ? `${on === nodes.length ? nodes.length : `${on} of ${nodes.length}`} machine${nodes.length === 1 ? "" : "s"} online · ${fleet.length} models · ${up} loaded` : "");
}

function renderChats() {
  const html = chats.map(c => `<div class="chat-li${c.id === currentId ? " active" : ""}" role="listitem">
      <button class="chat-open" data-chat="${esc(c.id)}" data-k="c:${esc(c.id)}" aria-current="${c.id === currentId}">
        <span class="ctitle">${esc(c.title)}</span>${c.model ? `<span class="cmodel">${esc(c.model)}</span>` : ""}</button>
      <button class="chat-del" data-del="${esc(c.id)}" data-k="d:${esc(c.id)}" aria-label="Delete chat ${esc(c.title)}" title="Delete">✕</button></div>`).join("")
    || `<div class="side-empty">No chats yet.</div>`;
  setHTML($("chatList"), html);
}

// ---- top bar, notice, empty state ----------------------------------------

function renderTop() {
  const m = info(selected);
  $("chipDot").className = "dot " + (m ? m.state : "stopped");
  $("chipName").textContent = m ? m.id : (status ? "No model" : "Connecting…");
  let st = "";
  if (m) {
    const w = stateWord(m);
    st = w.text || (m.state === "stopped" ? "not loaded" : m.state);
    if (m.resident) st += " · resident";
    if (nodes.length > 1) st += " · " + m.node;
  }
  $("chipState").textContent = st;
  $("chip").setAttribute("aria-label", `Model: ${m ? m.id + ", " + st : "none"}. Change model`);
  document.title = (streaming ? "● " : "") + (m ? m.id + " – " : "") + "ai-swap";
  renderNotice();
}

// What sending will do, when the selected model isn't loaded yet.
function renderNotice() {
  const n = $("notice"), m = info(selected);
  const nd = m && nodes.find(x => x.name === m.node);
  if (nd?.lock && !streaming) {
    const html = `<span class="ico">⚠︎</span><span><b>${esc(nd.name)}</b>: ${esc(lockText(nd.lock))}</span>`;
    if (n.innerHTML !== html) n.innerHTML = html;
    n.classList.remove("hidden");
    return;
  }
  if (!m || m.state === "ready" || streaming) { n.classList.add("hidden"); n.innerHTML = ""; return; }
  let html;
  if (m.state === "starting" || pending.get(m.id) === "load") {
    html = `<span class="ico">◌</span><span><b>${esc(m.id)}</b> is ${esc(stateWord(m).text)}. You can send now; the reply starts once it's ready.</span>`;
  } else {
    const loaded = (nd?.models || []).filter(x => x.name !== m.name && (x.state === "ready" || x.state === "starting"));
    const evict = [];
    if (nd && nd.budget > 0) {
      let used = loaded.reduce((t, x) => t + (x.memory_gb || 0), 0);
      for (const x of loaded.slice().sort((a, b) => Date.parse(a.last_used || 0) - Date.parse(b.last_used || 0))) {
        if (used + (m.memory_gb || 0) <= nd.budget) break;
        evict.push(x); used -= x.memory_gb || 0;
      }
    }
    const t = m.load_seconds ? `about ${Math.round(m.load_seconds)} s last time` : "can take a minute";
    html = `<span class="ico">⚠︎</span><span>Sending will load <b>${esc(m.id)}</b> (${m.memory_gb ? "~" + m.memory_gb + " GB, " : ""}${t})` +
      (evict.length ? ` and unload ${evict.map(x => `<b>${esc(x.name)}</b>${x.resident ? " (resident; it comes back when the GPU is free)" : ""}`).join(", ")}` : "") + ".</span>";
  }
  if (n.innerHTML !== html) n.innerHTML = html;
  n.classList.remove("hidden");
}

// ---- messages --------------------------------------------------------------

function msgEl(m, idx) {
  const el = document.createElement("div");
  el.className = "msg " + m.role;
  el.dataset.i = idx;
  if (m.role === "user") {
    el.innerHTML = `<div class="body"></div>
      <div class="meta"><span class="acts"><button class="ghost" data-msg="copy">Copy</button><button class="ghost" data-msg="edit">Edit</button></span></div>`;
    el.querySelector(".body").textContent = m.content;
    return el;
  }
  el.innerHTML = `<div class="role"></div><div class="body"><details class="thinking hidden"><summary></summary><div class="think-text"></div></details><div class="content"></div><div class="err"></div></div>
    <div class="meta"><span class="mtext"></span><span class="acts"><button class="ghost" data-msg="copy">Copy</button><button class="ghost" data-msg="retry">Retry</button></span></div>`;
  const node = m.node || info(m.model)?.node;
  const showNode = node && nodes.length > 1;
  const label = showNode ? String(m.model || "").split("@")[0] : m.model; // "x@node" + "on node" says it twice
  el.querySelector(".role").innerHTML = `<b>${esc(label || "assistant")}</b>${showNode ? `<span class="on">on ${esc(node)}</span>` : ""}`;
  // Remember the user's own open/closed choice; our updates don't count.
  el.querySelector("summary").addEventListener("click", () => {
    const det = el.querySelector("details");
    m.thinkOpen = !det.open;
  });
  fillAssistant(el, m);
  return el;
}

function fillAssistant(el, m) {
  const live = !!streaming && streaming.reply === m;
  const det = el.querySelector("details");
  if (m.thinking) {
    det.classList.remove("hidden");
    const secs = m.thinkSecs ?? (live && m.tThink0 ? (Date.now() - m.tThink0) / 1000 : 0);
    const label = live && !m.content ? `Thinking… ${Math.round(secs)}s` : secs ? `Thought for ${Math.round(secs)}s` : "Thinking";
    const sum = det.querySelector("summary");
    if (sum.textContent !== label) sum.textContent = label;
    const tt = det.querySelector(".think-text");
    const stick = tt.scrollTop + tt.clientHeight >= tt.scrollHeight - 8;
    if (tt.textContent !== m.thinking) { tt.textContent = m.thinking; if (stick) tt.scrollTop = tt.scrollHeight; }
    const want = m.thinkOpen ?? (live && !m.content);
    if (det.open !== want) det.open = want;
  }
  const c = el.querySelector(".content");
  let html;
  if (m.content) html = md(m.content);
  else if (live && !m.thinking) html = `<span class="waiting">${esc(m.phase || "Waiting for the model…")}</span>`;
  else if (!m.thinking && !m.error && !live) html = `<span class="waiting">(empty reply)</span>`;
  else html = "";
  if (c._html !== html) { c.innerHTML = html; c._html = html; }
  el.querySelector(".err").textContent = m.error ? "Error: " + m.error : "";
  el.querySelector(".mtext").textContent = m.meta || "";
  el.querySelector('[data-msg="retry"]').classList.toggle("hidden", live);
  el.querySelector('[data-msg="copy"]').classList.toggle("hidden", !m.content);
}

function renderMessages() {
  const box = $("messages"), c = current();
  box.innerHTML = "";
  if (!c || !c.messages.length) {
    const m = info(selected);
    if (!m) { box.innerHTML = `<div class="empty">${status ? "Pick a model on the left to start." : "Connecting to ai-swap…"}</div>`; return; }
    const st = m.state === "ready" ? "Loaded and ready" : m.state === "starting" ? "Loading now" : m.state === "failed" ? "Failed to load last time" :
      `Not loaded: your first message loads it${m.load_seconds ? ` (about ${Math.round(m.load_seconds)} s last time)` : ""}`;
    const chips = [nodes.length > 1 && "on " + m.node, m.engine, m.memory_gb && gb(m.memory_gb), m.ctx && fmtTok(m.ctx) + " context", m.resident && "resident"].filter(Boolean);
    box.innerHTML = `<div class="hello"><div class="hname">${esc(m.id)}</div>
      <div class="hstate"><span class="dot ${esc(m.state)}"></span>${esc(st)}</div>
      <div class="chips">${chips.map(x => `<span>${esc(x)}</span>`).join("")}</div>
      <div class="tip">Press <kbd>/</kbd> to switch models. Chats stay in this browser.</div></div>`;
    return;
  }
  c.messages.forEach((m, i) => box.appendChild(msgEl(m, i)));
  box.lastElementChild?.classList.add("last");
  box.scrollTop = box.scrollHeight;
}

function render() { renderChats(); renderModelList(); renderTop(); renderMessages(); }

// ---- models table ----------------------------------------------------------

function renderFleet() {
  if ($("view-models").classList.contains("hidden")) return;
  const up = fleet.filter(isUp).length;
  let html = `<div class="fleet-sum">${nodes.length} machine${nodes.length === 1 ? "" : "s"} · ${fleet.length} models · ${up} loaded. Every model is reachable from any machine; ids ending in <code>@machine</code> pick a copy on a specific one.</div>`;
  for (const nd of nodes) {

    const facts = [nd.local ? "this machine" : "peer", nd.os && `${nd.os}/${nd.arch}`, nd.version && "v" + nd.version,
      !nd.online && (nd.seen ? `offline, last seen ${age(nd.seen)} ago` : "offline")].filter(Boolean).join(" · ");
    const busyLegend = nd.models.some(m => m.state === "ready" && m.inflight), loadLegend = nd.models.some(m => m.state === "starting");
    html += `<section class="ncard${nd.online ? "" : " off"}" aria-label="${esc(nd.name)}">
      <div class="ncard-head"><div><h3><span class="dot ${nd.online ? "ready" : "failed"}"></span>${esc(nd.name)}</h3><div class="nsub">${esc(facts)}</div></div>
        ${nd.lock ? `<div class="resv" role="note"><span>${esc(lockText(nd.lock))}</span><button class="small" data-act="release" data-ref="${esc(nd.name)}" data-k="rl:${esc(nd.name)}" title="Release it now, e.g. if the benchmark crashed">Release</button></div>` : ""}
        ${nd.online ? `<div class="nmem"><b>${nd.used.toFixed(0)}</b> / ${nd.budget ? nd.budget.toFixed(0) + " GB" : "∞"} reserved</div>${memBar(nd)}
        <div class="legend">${nd.models.filter(m => isUp(m)).map(m => `<span><i class="${segClass(m)}"></i>${esc(m.name)} ${gb(m.memory_gb)}</span>`).join("") || "<span>Nothing loaded</span>"}
          ${busyLegend ? `<span><i class="busy"></i>busy</span>` : ""}${loadLegend ? `<span><i class="starting"></i>loading</span>` : ""}</div>` : `<div class="nmem">${esc(nd.error || "")}</div>`}</div>`;
    if (nd.online && list.length) {
      html += `<table class="fleet"><colgroup><col><col class="c-state hide-s"><col class="c-mem hide-n"><col class="c-ctx hide-n"><col class="c-eng hide-n"><col class="c-act"></colgroup><thead><tr><th>Model</th><th class="hide-s">State</th><th class="hide-n">Memory</th><th class="hide-n">Context</th><th class="hide-n">Engine</th><th></th></tr></thead><tbody>`;
      for (const m of list) {
        const w = stateWord(m), p = pending.get(m.id), isup = isUp(m);
        html += `<tr class="${isup ? "up" : ""}">
          <td><span class="dot inl ${esc(m.state)}" aria-hidden="true"></span><span class="mn">${esc(m.name)}</span> ${m.resident ? `<span class="pill">resident</span>` : ""}${m.id !== m.name ? `<div class="sub">id ${esc(m.id)}</div>` : ""}${m.aliases?.length ? `<div class="sub al">aliases: ${esc(m.aliases.join(", "))}</div>` : ""}</td>
          <td class="nw hide-s"><span class="state"><span class="dot ${esc(m.state)}"></span>${esc(w.text || (m.state === "stopped" ? "not loaded" : m.state))}</span>${m.error ? `<div class="errtxt">${esc(m.error)}</div>` : ""}</td>
          <td class="nw num hide-n">${m.memory_gb ? gb(m.memory_gb) : "—"}</td>
          <td class="nw num hide-n">${m.ctx ? fmtTok(m.ctx) : "—"}</td>
          <td class="nw hide-n">${esc(m.engine)}</td>
          <td class="act"><button class="small" data-act="${isup ? "unload" : "load"}" data-ref="${esc(m.id)}" data-k="t:${esc(m.id)}" ${p ? "disabled" : ""}>${p ? (p === "load" ? "Loading…" : "Unloading…") : isup ? "Unload" : "Load"}</button>
            <button class="small ghost" data-act="logs" data-ref="${esc(m.id)}" data-k="tl:${esc(m.id)}">Logs</button>
            <button class="small ghost" data-act="chat" data-ref="${esc(m.id)}" data-k="tc:${esc(m.id)}">Chat</button></td></tr>`;
      }
      html += `</tbody></table>`;
    }
    html += `</section>`;

  setHTML($("fleet"), html);
