<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ai-swap</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66;
  --border: #e3e2dd; --accent: #2f6fde; --accent-text: #fff;
  --user: #eef3fd; --code: #f1f0ec; --ok: #1f8a4c; --warn: #b7791f; --bad: #c53030;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161615; --panel: #1f1f1d; --text: #ecebe6; --muted: #9a9a93;
    --border: #33332f; --accent: #6b9cf5; --accent-text: #0d0d0c;
    --user: #22293a; --code: #2a2a27; --ok: #4ccb84; --warn: #e2b04a; --bad: #f07171;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
  display: grid; grid-template-columns: 260px 1fr 320px; grid-template-rows: 100%;
}
button, select, textarea { font: inherit; color: inherit; }
button {
  border: 1px solid var(--border); background: var(--panel); border-radius: 8px;
  padding: 6px 12px; cursor: pointer;
}
button:hover { border-color: var(--muted); }
button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
button.small { padding: 2px 8px; font-size: 13px; }
aside {
  border-right: 1px solid var(--border); background: var(--panel);
  display: flex; flex-direction: column; min-height: 0;
}
aside header { padding: 14px; display: flex; gap: 8px; align-items: center; justify-content: space-between; }
aside h1 { font-size: 16px; margin: 0; }
.side-title {
  padding: 10px 14px 4px; font-size: 12px; font-weight: 600; letter-spacing: .04em;
  text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; align-items: center;
}
.side-title button { text-transform: none; letter-spacing: 0; font-weight: 400; }
#modelList { flex: 0 1 auto; overflow: auto; padding: 0 8px; min-height: 80px; }
#chats { flex: 1 1 0; overflow: auto; padding: 0 8px; min-height: 80px; }
.model-node { padding: 6px 10px 2px; font-size: 12px; color: var(--muted); }
.model-item {
  width: 100%; text-align: left; border-radius: 8px; cursor: pointer;
  padding: 4px 6px 4px 10px; display: flex; align-items: center; gap: 2px; font-size: 14px; min-height: 32px;
}
.model-item:hover, .model-item:focus-visible { background: var(--bg); }
.model-item .mact {
  visibility: hidden; border: 1px solid var(--border); background: var(--panel); color: var(--muted);
  padding: 0; width: 24px; height: 24px; margin-left: 6px; border-radius: 6px; font-size: 11px; line-height: 1; flex: none;
}
.model-item:hover .mact, .model-item:focus-within .mact, .model-item .mact.pending { visibility: visible; }
.model-item .mact:hover { color: var(--text); border-color: var(--muted); }
.model-item .mact:disabled { cursor: wait; }
@media (hover: none) { .model-item .mact { visibility: visible; } }
.model-item.active { background: var(--user); }
.model-item .mname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.model-item .tag { font-size: 11px; color: var(--muted); margin-left: 6px; white-space: nowrap; }
.chat-item {
  padding: 8px 10px; border-radius: 8px; cursor: pointer; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; display: flex; justify-content: space-between; gap: 6px;
}
.chat-item:hover { background: var(--bg); }
.chat-item.active { background: var(--user); }
.chat-item .del { visibility: hidden; color: var(--muted); border: 0; background: none; padding: 0 4px; }
.chat-item:hover .del { visibility: visible; }
#nodes { border-top: 1px solid var(--border); padding: 12px 14px; font-size: 13px; }
.node { margin-bottom: 10px; }
.node .name { display: flex; justify-content: space-between; }
.bar { height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; margin-top: 4px; }
.bar > div { height: 100%; background: var(--accent); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
main { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.topbar {
  display: flex; gap: 10px; align-items: center; padding: 10px 16px;
  border-bottom: 1px solid var(--border); background: var(--panel);
}
.topbar select { padding: 6px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); max-width: 60vw; }
.topbar .spacer { flex: 1; }
#modelState { font-size: 13px; color: var(--muted); }
#view-chat, #view-models { flex: 1; min-height: 0; display: flex; flex-direction: column; }
#messages { flex: 1; overflow: auto; padding: 24px 16px; }
.msg { max-width: 820px; margin: 0 auto 18px; }
.msg .role { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.msg .body { padding: 10px 14px; border-radius: 10px; overflow-wrap: anywhere; }
.msg.user .body { background: var(--user); white-space: pre-wrap; }
.msg.assistant .body { background: var(--panel); border: 1px solid var(--border); }
.msg .meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
.msg.error .body { border-color: var(--bad); color: var(--bad); }
.body pre { background: var(--code); padding: 10px; border-radius: 6px; overflow: auto; }
.body code { background: var(--code); padding: 1px 4px; border-radius: 4px; font: 13px/1.45 ui-monospace, Menlo, monospace; }
.body pre code { background: none; padding: 0; }
.body p { margin: 0 0 8px; } .body p:last-child { margin-bottom: 0; }
details.thinking { margin-bottom: 8px; color: var(--muted); font-size: 14px; }
details.thinking > div { white-space: pre-wrap; border-left: 2px solid var(--border); padding-left: 10px; }
.composer { border-top: 1px solid var(--border); background: var(--panel); padding: 12px 16px; }
.composer form { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
.composer textarea {
  flex: 1; resize: none; line-height: 1.4; min-height: calc(4.2em + 22px); max-height: 240px; padding: 10px 12px;
  border-radius: 10px; border: 1px solid var(--border); background: var(--bg);
}
.empty { color: var(--muted); text-align: center; margin-top: 18vh; }
#view-models { overflow: auto; padding: 16px; }
table { border-collapse: collapse; width: 100%; max-width: 1100px; margin: 0 auto; }
th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--border); font-size: 14px; }
th { color: var(--muted); font-weight: 500; }
#logs {
  max-width: 1100px; margin: 16px auto; white-space: pre-wrap; background: var(--code);
  padding: 12px; border-radius: 8px; font: 12px/1.4 ui-monospace, Menlo, monospace;
  max-height: 50vh; overflow: auto; display: none;
}
.hidden { display: none !important; }
#statsPane {
  display: block;
  border-left: 1px solid var(--border); border-right: 0; background: var(--panel); overflow: auto;
  padding: 0 14px 16px; font-size: 13px; min-width: 0;
}
body.no-stats { grid-template-columns: 260px 1fr; }
body.no-stats #statsPane { display: none; }
#statsPane h2 { font-size: 15px; margin: 14px 0 2px; overflow-wrap: anywhere; }
#statsPane .sub { color: var(--muted); margin-bottom: 6px; }
#statsPane h3 {
  font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
  color: var(--muted); margin: 16px 0 6px; padding-top: 10px; border-top: 1px solid var(--border);
}
#statsPane dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; }
#statsPane dt { color: var(--muted); white-space: nowrap; }
#statsPane dd { margin: 0; text-align: right; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
#statsPane .big { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
#statsPane .big small { font-size: 13px; font-weight: 400; color: var(--muted); }
#statsPane .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 6px 0 10px; }
#statsPane .kpi .label { color: var(--muted); font-size: 12px; }
#statsPane .meter { margin: 6px 0 10px; }
#statsPane .meter .row { display: flex; justify-content: space-between; gap: 8px; }
#statsPane .meter .row span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
#statsPane svg.spark { width: 100%; height: 34px; display: block; color: var(--accent); }
#statsPane .note { color: var(--muted); font-size: 12px; margin-top: 6px; }
#statsPane .actions { display: flex; gap: 6px; margin: 8px 0 2px; }
#statsPane .actions button:disabled { opacity: .6; cursor: wait; }
#statsLogs {
  white-space: pre-wrap; background: var(--code); padding: 8px; border-radius: 6px; margin-top: 8px;
  font: 11px/1.4 ui-monospace, Menlo, monospace; max-height: 40vh; overflow: auto;
}
@media (max-width: 1100px) {
  body:not(.show-stats) { grid-template-columns: 260px 1fr; }
  body:not(.show-stats) #statsPane { display: none; }
  body.show-stats #statsPane { display: block; position: fixed; inset: 0 0 0 auto; width: min(340px, 90vw); z-index: 6; box-shadow: -4px 0 16px rgb(0 0 0 / .15); }
}
@media (max-width: 760px) {
  body, body:not(.show-stats) { grid-template-columns: 1fr; }
  aside { display: none; }
  body.show-side aside { display: flex; position: fixed; inset: 0 25% 0 0; z-index: 5; }
}
</style>
</head>
<body>
<aside>
  <header>
    <h1>ai-swap <span id="ver" style="font-weight:400;font-size:12px;color:var(--muted)"></span></h1>
  </header>
  <div class="side-title">Models</div>
  <div id="modelList"></div>
  <div class="side-title">Chats <button class="small" id="newChat" title="New chat">+ New</button></div>
  <div id="chats"></div>
  <div id="nodes"></div>
</aside>
<main>
  <div class="topbar">
    <button class="small" id="sideToggle" title="Models and chats">☰</button>
    <select id="model" aria-label="Model"></select>
    <span id="modelState"></span>
    <span class="spacer"></span>
    <button class="small" id="tabChat">Chat</button>
    <button class="small" id="tabModels">Models</button>
    <button class="small" id="statsToggle" title="Show or hide model stats">Stats</button>
  </div>

  <section id="view-chat">
    <div id="messages"></div>
    <div class="composer">
      <form id="form">
        <textarea id="input" rows="3" placeholder="Message (Enter to send, Shift+Enter for newline)"></textarea>
        <button class="primary" id="send" type="submit">Send</button>
      </form>
    </div>
  </section>

  <section id="view-models" class="hidden">
    <table>
      <thead><tr><th>Model</th><th>Node</th><th>Engine</th><th>State</th><th>Memory</th><th></th></tr></thead>
      <tbody id="modelRows"></tbody>
    </table>
    <div id="logs"></div>
  </section>
</main>
<aside id="statsPane" aria-label="Model stats"><div class="note" style="margin-top:16px">Pick a model to see its stats.</div></aside>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

let chats = store.get("aiswap.chats", []);
let currentId = store.get("aiswap.current", null);
let models = [];
let status = null;
let abort = null;

const stateColor = { ready: "var(--ok)", starting: "var(--warn)", stopping: "var(--warn)", failed: "var(--bad)", stopped: "var(--muted)" };

function current() { return chats.find(c => c.id === currentId); }
function save() { store.set("aiswap.chats", chats); store.set("aiswap.current", currentId); }

// crypto.randomUUID only exists in secure contexts (HTTPS or localhost), and
// the UI is usually opened over plain http from another machine.
function newId() {
  if (crypto.randomUUID) return crypto.randomUUID();
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
}

function newChat() {
  const c = { id: newId(), title: "New chat", model: $("model").value, messages: [] };
  chats.unshift(c); currentId = c.id; save(); render();
  $("input").focus();
}

// ---- rendering ---------------------------------------------------------

function esc(s) { return s.replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch])); }

// Minimal markdown: fenced code, inline code, bold, paragraphs.
function md(src) {
  const parts = src.split(/```/);
  return parts.map((p, i) => {
    if (i % 2 === 1) {
      const nl = p.indexOf("\n");
      const code = nl >= 0 ? p.slice(nl + 1) : p;
      return "<pre><code>" + esc(code.replace(/\n$/, "")) + "</code></pre>";
    }
    return p.split(/\n{2,}/).filter(x => x.trim()).map(para =>
      "<p>" + esc(para)
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/\n/g, "<br>") + "</p>").join("");
  }).join("");
}

function renderChats() {
  $("chats").innerHTML = "";
  for (const c of chats) {
    const el = document.createElement("div");
    el.className = "chat-item" + (c.id === currentId ? " active" : "");
    el.innerHTML = `<span>${esc(c.title)}</span><button class="del" title="Delete">✕</button>`;
    el.onclick = () => { currentId = c.id; if (c.model && models.some(m => m.id === c.model)) $("model").value = c.model; save(); render(); };
    el.querySelector(".del").onclick = (e) => {
      e.stopPropagation();
      chats = chats.filter(x => x.id !== c.id);
      if (currentId === c.id) currentId = chats[0]?.id ?? null;
      save(); render();
    };
    $("chats").appendChild(el);
  }
}

function msgEl(m) {
  const el = document.createElement("div");
  el.className = "msg " + m.role + (m.error ? " error" : "");
  const who = m.role === "user" ? "You" : (m.model || "assistant");
  let inner = "";
  if (m.thinking) inner += `<details class="thinking"${m.content ? "" : " open"}><summary>Thinking</summary><div>${esc(m.thinking)}</div></details>`;
  inner += m.role === "user" ? esc(m.content) : md(m.content || (m.thinking ? "" : "…"));
  el.innerHTML = `<div class="role">${esc(who)}</div><div class="body">${inner}</div>` +
    (m.meta ? `<div class="meta">${esc(m.meta)}</div>` : "");
  return el;
}

function renderMessages() {
  const box = $("messages");
  const c = current();
  box.innerHTML = "";
  if (!c || c.messages.length === 0) {
    box.innerHTML = `<div class="empty">Pick a model and start typing.<br>Models load on first use; big ones can take a minute.</div>`;
    return;
  }
  for (const m of c.messages) box.appendChild(msgEl(m));
  box.scrollTop = box.scrollHeight;
}

function renderModelSelect() {
  const sel = $("model");
  const prev = sel.value || current()?.model || store.get("aiswap.model", "");
  sel.innerHTML = "";
  for (const m of models) {
    const o = document.createElement("option");
    o.value = m.id;
    o.textContent = `${m.id}  ·  ${m.node}  ·  ${m.status}`;
    sel.appendChild(o);
  }
  if (models.some(m => m.id === prev)) sel.value = prev;
  else {
    const loaded = models.find(m => m.status === "ready") || models.find(m => m.status === "starting");
    if (loaded) sel.value = loaded.id;
  }
  updateModelState();
}

// ---- load / unload ------------------------------------------------------

const pending = new Map(); // model id -> "load" | "unload" while a request is in flight

// actionFor says which control a model should offer in its current state.
function actionFor(id, state) {
  const p = pending.get(id);
  if (p) return { act: p, pending: true, label: p === "load" ? "Loading…" : "Stopping…" };
  const up = state === "ready" || state === "starting";
  return { act: up ? "unload" : "load", pending: false, label: up ? "Unload" : "Load" };
}

async function modelAction(id, act) {
  if (pending.has(id)) return;
  pending.set(id, act);
  renderModelList();
  const sb = $("model").value === id && $("statsPane").querySelector('.actions [data-act="load"], .actions [data-act="unload"]');
  if (sb) { sb.disabled = true; sb.textContent = actionFor(id).label; }
  // Show the "starting"/"stopping" state while the (possibly long) request runs.
  const poll = setTimeout(refresh, 400);
  try {
    const r = await fetch(`/api/models/${encodeURIComponent(id)}/${act}`, { method: "POST" });
    if (!r.ok) alert(`${act === "load" ? "Load" : "Unload"} ${id} failed: ` + ((await r.json().catch(() => ({}))).error || r.statusText));
  } catch (e) {
    alert(`${act} ${id} failed: ${e.message}`);
  } finally {
    clearTimeout(poll);
    pending.delete(id);
    refresh();
  }
}

// Sidebar model list, grouped by node; clicking one switches the chat to it.
function renderModelList() {
  const resident = new Set();
  if (status) {
    status.node.models.forEach(m => m.resident && resident.add(m.name + "@" + status.node.name));
    status.peers.forEach(p => p.node?.models.forEach(m => m.resident && resident.add(m.name + "@" + p.name)));
  }
  const byNode = new Map();
  for (const m of models) {
    if (!byNode.has(m.node)) byNode.set(m.node, []);
    byNode.get(m.node).push(m);
  }
  const selected = $("model").value;
  let html = "";
  for (const [node, list] of byNode) {
    if (byNode.size > 1) html += `<div class="model-node">${esc(node)}</div>`;
    for (const m of list) {
      const tags = [];
      if (resident.has(m.id.split("@")[0] + "@" + m.node)) tags.push("resident");
      if (m.status === "starting") tags.push("loading");
      if (m.status === "failed") tags.push("failed");
      const act = actionFor(m.id, m.status);
      html += `<div class="model-item${m.id === selected ? " active" : ""}" role="button" tabindex="0" data-model="${esc(m.id)}" title="${esc(m.id)} on ${esc(m.node)}: ${esc(m.status)}">
        <span class="dot" style="background:${stateColor[m.status] || "var(--muted)"}"></span>
        <span class="mname">${esc(m.id)}</span>${tags.map(t => `<span class="tag">${t}</span>`).join("")}
        <button class="mact${act.pending ? " pending" : ""}" data-act="${act.act}" data-ref="${esc(m.id)}" title="${act.label}" aria-label="${act.label} ${esc(m.id)}" ${act.pending ? "disabled" : ""}>${act.pending ? "…" : act.act === "load" ? "▶" : "■"}</button></div>`;
    }
  }
  $("modelList").innerHTML = html || `<div class="model-node">no models</div>`;
  if (!scrolledToModel && models.length) {
    scrolledToModel = true;
    $("modelList").querySelector(".model-item.active")?.scrollIntoView({ block: "nearest" });
  }
}
let scrolledToModel = false;

function selectModel(id) {
  $("model").value = id;
  $("model").onchange();
  document.body.classList.remove("show-side");
  $("input").focus();
}

function updateModelState() {
  renderModelList();
  const m = models.find(x => x.id === $("model").value);
  $("modelState").innerHTML = m
    ? `<span class="dot" style="background:${stateColor[m.status] || "var(--muted)"}"></span>${esc(m.engine)} on ${esc(m.node)}`
    : (models.length ? "" : "no models configured");
}

function renderNodes() {
  if (!status) return;
  const nodes = [{ name: status.node.name, online: true, node: status.node }, ...status.peers];
  $("nodes").innerHTML = nodes.map(p => {
    const n = p.node;
    if (!p.online || !n) return `<div class="node"><div class="name"><span><span class="dot" style="background:var(--bad)"></span>${esc(p.name)}</span><span>offline</span></div></div>`;
    const pct = n.memory_budget_gb ? Math.min(100, 100 * n.memory_used_gb / n.memory_budget_gb) : 0;
    const loaded = n.models.filter(m => m.state === "ready" || m.state === "starting").map(m => m.name).join(", ") || "idle";
    return `<div class="node"><div class="name"><span><span class="dot" style="background:var(--ok)"></span>${esc(p.name)}</span>
      <span>${n.memory_used_gb.toFixed(0)}/${n.memory_budget_gb ? n.memory_budget_gb.toFixed(0) : "∞"} GB</span></div>
      <div class="bar"><div style="width:${pct}%"></div></div>
      <div style="color:var(--muted);margin-top:3px">${esc(loaded)}</div></div>`;
  }).join("");
}

function renderModelTable() {
  if (!status) return;
  const rows = [];
  const add = (node, local, m) => rows.push({ node, local, ...m });
  status.node.models.forEach(m => add(status.node.name, true, m));
  status.peers.forEach(p => p.node?.models.forEach(m => add(p.name, false, m)));
  $("modelRows").innerHTML = rows.map(r => {
    const ref = r.local ? r.name : `${r.name}@${r.node}`;
    return `<tr>
      <td>${esc(r.name)}${r.resident ? ` <span title="Kept loaded by default; gives way to other models when memory is short" style="font-size:11px;padding:1px 6px;border:1px solid var(--muted);border-radius:8px;color:var(--muted)">resident</span>` : ""}${r.aliases?.length ? `<div style="color:var(--muted);font-size:12px">${esc(r.aliases.join(", "))}</div>` : ""}</td>
      <td>${esc(r.node)}</td><td>${esc(r.engine)}${r.runnable ? "" : " (n/a on this OS)"}</td>
      <td><span class="dot" style="background:${stateColor[r.state]}"></span>${esc(r.state)}${r.error ? `<div style="color:var(--bad);font-size:12px">${esc(r.error)}</div>` : ""}</td>
      <td>${r.memory_gb ? r.memory_gb + " GB" : "—"}</td>
      <td style="white-space:nowrap">
        <button class="small" data-act="load" data-ref="${esc(ref)}" ${r.runnable ? "" : "disabled"}>Load</button>
        <button class="small" data-act="unload" data-ref="${esc(ref)}">Unload</button>
        <button class="small" data-act="logs" data-ref="${esc(ref)}">Logs</button>
      </td></tr>`;
  }).join("");
}

function render() { renderChats(); renderMessages(); updateModelState(); }

// ---- data --------------------------------------------------------------

async function refresh() {
  try {
    const [mr, sr] = await Promise.all([fetch("/v1/models"), fetch("/api/status")]);
    models = (await mr.json()).data;
    status = await sr.json();
    $("ver").textContent = status.node.version ? "v" + status.node.version : "";
    renderModelSelect(); renderNodes(); renderModelTable(); refreshStats();
  } catch (e) { /* server restarting; try again next tick */ }
}

async function send(text) {
  let c = current();
  if (!c) { newChat(); c = current(); }
  const model = $("model").value;
  if (!model) return;
  c.model = model;
  store.set("aiswap.model", model);
  if (c.messages.length === 0) c.title = text.slice(0, 48);
  c.messages.push({ role: "user", content: text });
  const reply = { role: "assistant", model, content: "", thinking: "" };
  c.messages.push(reply);
  save(); render();

  const box = $("messages");
  let el = box.lastElementChild;
  const repaint = () => { const n = msgEl(reply); el.replaceWith(n); el = n; box.scrollTop = box.scrollHeight; };

  abort = new AbortController();
  $("send").textContent = "Stop";
  const t0 = performance.now();
  let tFirst = 0, chunks = 0, usage = null;
  try {
    const res = await fetch("/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      signal: abort.signal,
      body: JSON.stringify({
        model, stream: true, stream_options: { include_usage: true },
        messages: c.messages.slice(0, -1).filter(m => !m.error).map(m => ({ role: m.role, content: m.content })),
      }),
    });
    if (!res.ok) {
      const j = await res.json().catch(() => ({}));
      throw new Error(j.error?.message || res.statusText);
    }
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, i).trim();
        buf = buf.slice(i + 1);
        if (!line.startsWith("data:")) continue;
        const data = line.slice(5).trim();
        if (data === "[DONE]") continue;
        let j; try { j = JSON.parse(data); } catch { continue; }
        if (j.usage) usage = j.usage;
        const d = j.choices?.[0]?.delta;
        if (!d) continue;
        const think = d.reasoning_content ?? d.reasoning ?? "";
        if (think || d.content) { if (!tFirst) tFirst = performance.now(); chunks++; }
        reply.thinking += think;
        reply.content += d.content ?? "";
        repaint();
      }
    }
  } catch (e) {
    if (e.name !== "AbortError") { reply.error = true; reply.content = "Error: " + e.message; }
  } finally {
    const secs = (performance.now() - (tFirst || t0)) / 1000;
    const toks = usage?.completion_tokens ?? chunks;
    const parts = [];
    if (tFirst) parts.push(`first token ${((tFirst - t0) / 1000).toFixed(1)}s`);
    if (toks && secs > 0) parts.push(`${(toks / secs).toFixed(1)} tok/s`);
    if (usage) parts.push(`${usage.prompt_tokens} in / ${usage.completion_tokens} out`);
    reply.meta = parts.join(" · ");
    repaint(); save();
    abort = null;
    $("send").textContent = "Send";
    refresh();
  }
}


// ---- stats pane ---------------------------------------------------------

const GB = 1024 ** 3;
const fmtBytes = b => b >= GB ? (b / GB).toFixed(b >= 10 * GB ? 1 : 2) + " GB" : (b / 1024 ** 2).toFixed(0) + " MB";
const fmtCount = n => n >= 1e9 ? (n / 1e9).toFixed(1) + "B" : n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? (n / 1e3).toFixed(1) + "k" : String(n);
const fmtTok = n => n >= 1024 && n % 1024 === 0 ? (n / 1024) + "k" : fmtCount(n);
const fmtSecs = s => s < 1 ? (s * 1000).toFixed(0) + " ms" : s < 90 ? s.toFixed(1) + " s" : s < 5400 ? (s / 60).toFixed(0) + " min" : (s / 3600).toFixed(1) + " h";
const fmtTPS = v => v ? v.toFixed(1) : "—";
const row = (k, v, title) => v === undefined || v === null || v === "" ? "" : `<dt>${k}</dt><dd${title ? ` title="${esc(title)}"` : ""}>${v}</dd>`;
function meter(label, used, total, extra) {
  const pct = total ? Math.min(100, 100 * used / total) : 0;
  return `<div class="meter"><div class="row"><span>${label}</span><span>${extra ?? `${fmtBytes(used)} / ${fmtBytes(total)}`}</span></div>
    <div class="bar"><div style="width:${pct}%"></div></div></div>`;
}
function spark(vals) {
  if (!vals || vals.length < 2) return "";
  const max = Math.max(...vals) * 1.1, n = vals.length;
  const pts = vals.map((v, i) => `${(i / (n - 1) * 100).toFixed(1)},${(30 - v / max * 28).toFixed(1)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 100 32" preserveAspectRatio="none" aria-label="recent generation speed">
    <polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`;
}

let statsBusy = false, statsFor = "";
async function refreshStats() {
  if (statsBusy || getComputedStyle($("statsPane")).display === "none") return;
  const id = $("model").value;
  if (!id) return;
  if (id !== statsFor) { statsFor = id; statsLogsText = ""; statsLogsStick = true; }
  statsBusy = true;
  try {
    const logsEl = $("statsLogs");
    if (logsEl) statsLogsStick = logsEl.scrollTop + logsEl.clientHeight >= logsEl.scrollHeight - 20;
    if (statsLogsOpen) await loadStatsLogs(id);
    const r = await fetch(`/api/models/${encodeURIComponent(id)}/stats`);
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
    if ($("model").value === id) renderStats(id, await r.json());
  } catch (e) {
    $("statsPane").innerHTML = `<h2>${esc(id)}</h2><div class="note">Stats unavailable: ${esc(e.message)}</div>`;
  } finally { statsBusy = false; }
}

function renderStats(id, d) {
  const st = d.status, c = d.config, b = d.backend || {}, q = d.requests || {}, mt = b.metrics || {};
  const ready = st.state === "ready";
  const now = Date.now();
  let h = `<h2>${esc(id)}</h2><div class="sub"><span class="dot" style="background:${stateColor[st.state]}"></span>${esc(st.state)} · ${esc(st.engine)} on ${esc(d.node)}${st.resident ? " · resident" : ""}</div>`;
  const act = actionFor(id, st.state);
  h += `<div class="actions">
    <button class="small${act.act === "load" ? " primary" : ""}" data-act="${act.act}" ${act.pending ? "disabled" : ""}>${act.label}</button>
    <button class="small" data-act="logs">${statsLogsOpen ? "Hide logs" : "Logs"}</button></div>`;
  if (st.error) h += `<div class="note" style="color:var(--bad)">${esc(st.error)}</div>`;

  // Performance
  const last = q.last;
  h += `<h3>Performance</h3><div class="kpis">
    <div class="kpi"><div class="label">Generation</div><div class="big">${fmtTPS(last?.gen_tps)} <small>tok/s</small></div></div>
    <div class="kpi"><div class="label">Avg (last ${q.recent_gen_tps?.length || 0})</div><div class="big">${fmtTPS(q.avg_gen_tps)} <small>tok/s</small></div></div>
  </div>${spark(q.recent_gen_tps)}<dl>
    ${row("Prompt processing", q.avg_prompt_tps ? fmtTPS(q.avg_prompt_tps) + " tok/s" : null)}
    ${row("Time to first token", q.avg_ttft_seconds ? fmtSecs(q.avg_ttft_seconds) + " avg" : null)}
    ${row("Draft acceptance", q.draft_accept_rate ? (q.draft_accept_rate * 100).toFixed(0) + "%" : null, "Speculative decoding: share of drafted tokens the model accepted")}
    ${row("Requests", q.requests ? `${q.requests}${q.errors ? ` (${q.errors} failed)` : ""}` : "none yet")}
    ${row("Tokens in / out", q.requests ? `${fmtCount(q.prompt_tokens)} / ${fmtCount(q.completion_tokens)}` : null)}
    ${last ? row("Last request", `${fmtCount(last.prompt_tokens || 0)} in${last.cached_tokens ? ` (${fmtCount(last.cached_tokens)} cached)` : ""} · ${fmtCount(last.completion_tokens || 0)} out`) : ""}
  </dl>`;
  if (last?.gen_tps_source === "measured") h += `<div class="note">Speed measured by ai-swap from the stream; this engine doesn't report its own timings.</div>`;

  // Live backend state
  if (ready && (b.slots || mt.kv_cache_usage_ratio !== undefined || mt.requests_processing !== undefined)) {
    h += `<h3>Live</h3>`;
    if (mt.kv_cache_usage_ratio !== undefined) h += meter("KV cache", mt.kv_cache_usage_ratio, 1, (mt.kv_cache_usage_ratio * 100).toFixed(1) + "%");
    h += `<dl>
      ${row("Slots busy", b.slots ? `${b.slots_busy ?? "?"} / ${b.slots}` : null, "Parallel request slots in the engine")}
      ${row("Queued", mt.requests_deferred !== undefined ? String(mt.requests_deferred) : null)}
      ${row("Tokens generated", mt.tokens_predicted_total !== undefined ? fmtCount(mt.tokens_predicted_total) : null, "Since this load, as counted by the engine")}
      ${row("Prompt tokens", mt.prompt_tokens_total !== undefined ? fmtCount(mt.prompt_tokens_total) : null, "Since this load, as counted by the engine")}
      ${row("Engine avg gen", mt.predicted_tokens_seconds ? fmtTPS(mt.predicted_tokens_seconds) + " tok/s" : null)}
      ${row("Engine avg prompt", mt.prompt_tokens_seconds ? fmtTPS(mt.prompt_tokens_seconds) + " tok/s" : null)}
    </dl>`;
  }

  // Memory
  h += `<h3>Memory</h3>`;
  if (d.rss_bytes) h += `<dl>${row("Process resident", fmtBytes(d.rss_bytes), "RSS of the engine process. On a discrete GPU, weights in VRAM are not included.")}</dl>`;
  h += meter("Node reserved", c.node_used_gb * GB, (c.node_budget_gb || c.node_used_gb) * GB,
    `${c.node_used_gb.toFixed(0)} / ${c.node_budget_gb ? c.node_budget_gb.toFixed(0) : "∞"} GB`);
  h += `<dl>${row("This model reserves", c.memory_gb + " GB", "memory_gb from the config, used for swap planning")}</dl>`;
  for (const g of d.gpus || []) {
    h += meter(`${esc(g.name)} VRAM${g.busy_percent !== undefined ? ` · ${g.busy_percent}% busy` : ""}`, g.vram_used_bytes, g.vram_total_bytes);
    if (g.gtt_used_bytes > 256 * 1024 ** 2) h += meter(`${esc(g.name)} GTT (system RAM)`, g.gtt_used_bytes, g.gtt_total_bytes);
  }

  // Model
  const mods = (b.modalities || []).filter(Boolean);
  h += `<h3>Model</h3><dl>
    ${row("Parameters", b.params ? fmtCount(b.params) : null)}
    ${row("Quantization", b.quant ? esc(b.quant) : null)}
    ${row("Weights", b.size_bytes ? fmtBytes(b.size_bytes) : null)}
    ${row("Context / request", b.ctx_per_slot ? fmtTok(b.ctx_per_slot) : (c.ctx ? fmtTok(c.ctx) : null))}
    ${row("Context total", b.ctx && b.ctx !== b.ctx_per_slot ? fmtTok(b.ctx) : null)}
    ${row("Trained context", b.ctx_train ? fmtTok(b.ctx_train) : null)}
    ${row("Inputs", mods.length ? esc(mods.join(", ")) : null)}
    ${row("Tool calling", b.tools === undefined ? null : b.tools ? "yes" : "no")}
    ${row("Speculative decoding", b.speculative ? "on" : null)}
    ${row("Vocabulary", b.vocab ? fmtCount(b.vocab) : null)}
    ${row("Embedding dim", b.embed_dim ? String(b.embed_dim) : null)}
  </dl>`;
  if (!ready) h += `<div class="note">Load the model to see what the engine reports about it.</div>`;

  // Backend
  const up = st.loaded_at ? (now - Date.parse(st.loaded_at)) / 1000 : 0;
  h += `<h3>Backend</h3><dl>
    ${row("Engine", esc(st.engine) + (b.build ? ` <span style="color:var(--muted)">${esc(b.build)}</span>` : ""))}
    ${row("Loaded for", up ? fmtSecs(up) : null)}
    ${row("Load time", st.load_seconds ? fmtSecs(st.load_seconds) : null, "Process start until the health check passed")}
    ${row("Idle unload", st.resident ? "never (resident)" : c.ttl_seconds ? "after " + fmtSecs(c.ttl_seconds) : "never")}
    ${row("Port", st.port ? String(st.port) : null)}
    ${row("PID", st.pid ? String(st.pid) : null)}
    ${row("File", (b.model_path || c.model) ? `<span title="${esc(b.model_path || c.model)}">${esc((b.model_path || c.model).split("/").pop())}</span>` : null)}
  </dl>`;
  if (statsLogsOpen) h += `<pre id="statsLogs">${esc(statsLogsText || "(loading logs…)")}</pre>`;
  const keepScroll = $("statsLogs")?.scrollTop;
  $("statsPane").innerHTML = h;
  const logs = $("statsLogs");
  if (logs) logs.scrollTop = statsLogsStick || keepScroll === undefined ? logs.scrollHeight : keepScroll;
}

let statsLogsOpen = false, statsLogsText = "", statsLogsStick = true;
async function loadStatsLogs(id) {
  try { statsLogsText = await (await fetch(`/api/models/${encodeURIComponent(id)}/logs`)).text() || "(no output yet)"; }
  catch (e) { statsLogsText = "Could not fetch logs: " + e.message; }
}

// ---- events ------------------------------------------------------------

$("form").onsubmit = (e) => {
  e.preventDefault();
  if (abort) { abort.abort(); return; }
  const text = $("input").value.trim();
  if (!text) return;
  $("input").value = ""; autosize();
  send(text);
};
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("form").requestSubmit(); }
});
function autosize() { const t = $("input"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 240) + "px"; }
$("input").addEventListener("input", autosize);
$("newChat").onclick = newChat;
$("modelList").onclick = (e) => {
  const a = e.target.closest("button[data-act]");
  if (a) { e.stopPropagation(); modelAction(a.dataset.ref, a.dataset.act); return; }
  const b = e.target.closest("[data-model]");
  if (b) selectModel(b.dataset.model);
};
$("modelList").onkeydown = (e) => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches(".model-item")) { e.preventDefault(); selectModel(e.target.dataset.model); }
};
$("statsPane").onclick = (e) => {
  const b = e.target.closest("button[data-act]");
  if (!b) return;
  const id = $("model").value;
  if (b.dataset.act === "logs") { statsLogsOpen = !statsLogsOpen; statsLogsStick = true; refreshStats(); return; }
  modelAction(id, b.dataset.act);
};
$("model").onchange = () => { const c = current(); if (c) { c.model = $("model").value; save(); } updateModelState(); refreshStats(); };
if (store.get("aiswap.stats", true) === false) document.body.classList.add("no-stats");
$("statsToggle").onclick = () => {
  if (matchMedia("(max-width: 1100px)").matches) document.body.classList.toggle("show-stats");
  else store.set("aiswap.stats", !document.body.classList.toggle("no-stats"));
  refreshStats();
};
$("sideToggle").onclick = () => document.body.classList.toggle("show-side");
$("tabChat").onclick = () => { $("view-chat").classList.remove("hidden"); $("view-models").classList.add("hidden"); };
$("tabModels").onclick = () => { $("view-models").classList.remove("hidden"); $("view-chat").classList.add("hidden"); refresh(); };
$("modelRows").onclick = async (e) => {
  const b = e.target.closest("button[data-act]");
  if (!b) return;
  const ref = encodeURIComponent(b.dataset.ref);
  if (b.dataset.act === "logs") {
    const r = await fetch(`/api/models/${ref}/logs`);
    $("logs").style.display = "block";
    $("logs").textContent = (await r.text()) || "(no output yet)";
    $("logs").scrollTop = $("logs").scrollHeight;
    return;
  }
  b.disabled = true; b.textContent = b.dataset.act === "load" ? "Loading…" : "Stopping…";
  modelAction(b.dataset.ref, b.dataset.act);
};

render();
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
